spring.application.name=group-project-local

spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=test
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.security=DEBUG

cloudinary.cloud-name=${CLOUDINARY_NAME:nama_default_kamu}
cloudinary.api-key=${CLOUDINARY_KEY:key_default_kamu}
cloudinary.api-secret=${CLOUDINARY_SECRET:secret_default_kamu}