<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Katalog — JSON</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="me-container me-page">
        <!-- Page Header -->
        <div class="me-page-header" style="margin-bottom: 32px;">
            <div>
                <span style="text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.75rem; font-weight: 800; color: var(--me-text-secondary); display: block; margin-bottom: 6px;">Admin</span>
                <h1 style="font-size: 2.5rem; font-weight: 900; margin: 0;">Monitoring Katalog</h1>
                <p style="color: var(--me-text-secondary); margin-top: 6px; margin-bottom: 0;">
                    Pantau, ubah, dan hapus seluruh produk yang terdaftar di platform.
                </p>
            </div>
            <div style="display: flex; gap: 8px;">
                <a th:href="@{/catalog}" class="me-btn me-btn--outline">Lihat Katalog</a>
                <a th:href="@{/homepage}" class="me-btn me-btn--secondary">← Beranda</a>
            </div>
        </div>

        <!-- Stats bar -->
        <div class="me-card me-card--flat" style="padding: 14px 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
            <span style="font-weight: 700; color: var(--me-text-secondary);">
                Total:
                <span style="font-size: 1.25rem; font-weight: 900; color: var(--me-text);" th:text="${catalogs != null ? catalogs.size() : 0}">0</span>
                produk terdaftar
            </span>
            <span class="me-badge me-badge--danger" style="font-size: 0.75rem;">🔒 Admin Only</span>
        </div>

        <!-- Empty State -->
        <div th:if="${catalogs == null or catalogs.isEmpty()}"
             class="me-card me-center" style="padding: 64px 24px; border-style: dashed; background: var(--me-surface);">
            <span style="font-size: 3.5rem; display: block; margin-bottom: 16px;">📦</span>
            <p style="font-weight: 700; font-size: 1.1rem; margin: 0;">Belum ada produk terdaftar.</p>
        </div>

        <!-- Table Card -->
        <div th:if="${catalogs != null and !catalogs.isEmpty()}"
             class="me-card me-card--flat" style="padding: 0; overflow: hidden;">
            <div style="overflow-x: auto;">
                <table class="me-table" style="margin: 0; border: none; border-radius: 0;">
                    <thead>
                        <tr>
                            <th style="width: 80px;">Foto</th>
                            <th>Nama Produk</th>
                            <th>Harga</th>
                            <th>Stok</th>
                            <th>Asal</th>
                            <th>Tgl Berangkat</th>
                            <th>Jastiper</th>
                            <th style="width: 70px;">Edit</th>
                            <th style="width: 90px;">Hapus</th>
                        </tr>
                    </thead>
                    <tbody id="admin-catalog-tbody">
                        <tr th:each="catalog : ${catalogs}" class="admin-catalog-row">
                            <td>
                                <img th:if="${catalog.imageUrl != null and !catalog.imageUrl.isEmpty()}"
                                     th:src="${catalog.imageUrl}"
                                     alt="Foto Produk"
                                     style="width: 60px; height: 60px; object-fit: cover; border-radius: var(--me-radius); border: var(--me-border-w) solid var(--me-border);">
                                <span th:if="${catalog.imageUrl == null or catalog.imageUrl.isEmpty()}"
                                      style="font-size: 1.5rem; display: block; text-align: center; opacity: 0.4;">📷</span>
                            </td>
                            <td>
                                <a th:href="@{/catalog/detail/{id}(id=${catalog.id})}"
                                   style="font-weight: 700; color: var(--me-text);"
                                   th:text="${catalog.name}">Nama Produk</a>
                                <div style="font-size: 0.78rem; color: var(--me-text-muted); margin-top: 2px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                                     th:text="${catalog.description}"></div>
                            </td>
                            <td style="font-weight: 800; white-space: nowrap;"
                                th:text="'Rp ' + ${#numbers.formatDecimal(catalog.price, 0, 'COMMA', 0, 'POINT')}">Rp 0</td>
                            <td>
                                <span th:if="${catalog.stock > 0}" class="me-badge me-badge--success"
                                      th:text="${catalog.stock}">0</span>
                                <span th:if="${catalog.stock <= 0}" class="me-badge me-badge--danger">Habis</span>
                            </td>
                            <td style="font-size: 0.85rem;" th:text="${catalog.originLocation}">-</td>
                            <td style="font-size: 0.85rem; white-space: nowrap;"
                                th:text="${catalog.travelDate != null ? #temporals.format(catalog.travelDate, 'dd MMM yyyy') : '-'}">-</td>
                            <td>
                                <span style="font-weight: 700; font-size: 0.85rem;" th:text="${catalog.jastiperUsername}">-</span>
                            </td>
                            <td>
                                <a th:href="@{/catalog/admin/edit/{id}(id=${catalog.id})}"
                                   class="me-btn me-btn--sm"
                                   style="background: var(--me-info); color: #fff; border-color: var(--me-info);">
                                    ✏️ Edit
                                </a>
                            </td>
                            <td>
                                <form th:action="@{/catalog/admin/delete/{id}(id=${catalog.id})}" method="post" style="margin: 0;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="me-btn me-btn--danger me-btn--sm"
                                            onclick="return confirm('Yakin ingin menghapus produk ini?')">
                                        🗑 Hapus
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <nav class="catalog-paging" id="admin-catalog-pagination" aria-label="Pagination" style="display: none;">
        </nav>
    </main>

    <script>
    (function() {
        var ITEMS_PER_PAGE = 15;
        var currentPage = 1;
        var allRows = [];

        function renderPagination(totalItems) {
            var container = document.getElementById('admin-catalog-pagination');
            if (!container) return;
            var totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            if (totalPages <= 1) { container.style.display = 'none'; return; }

            container.style.display = 'flex';
            var html = '';

            if (currentPage > 1)
                html += '<button class="me-btn me-btn--outline me-btn--sm" onclick="adminGoToPage(' + (currentPage - 1) + ')">&laquo; Prev</button>';

            var maxV = 5, start = Math.max(1, currentPage - 2), end = Math.min(totalPages, start + maxV - 1);
            if (end - start < maxV - 1) start = Math.max(1, end - maxV + 1);

            if (start > 1) {
                html += '<button class="me-btn me-btn--outline me-btn--sm" onclick="adminGoToPage(1)">1</button>';
                if (start > 2) html += '<span style="padding:0 4px;color:var(--me-text-muted)">…</span>';
            }
            for (var i = start; i <= end; i++) {
                html += i === currentPage
                    ? '<button class="me-btn me-btn--primary me-btn--sm">' + i + '</button>'
                    : '<button class="me-btn me-btn--outline me-btn--sm" onclick="adminGoToPage(' + i + ')">' + i + '</button>';
            }
            if (end < totalPages) {
                if (end < totalPages - 1) html += '<span style="padding:0 4px;color:var(--me-text-muted)">…</span>';
                html += '<button class="me-btn me-btn--outline me-btn--sm" onclick="adminGoToPage(' + totalPages + ')">' + totalPages + '</button>';
            }
            if (currentPage < totalPages)
                html += '<button class="me-btn me-btn--outline me-btn--sm" onclick="adminGoToPage(' + (currentPage + 1) + ')">Next &raquo;</button>';

            container.innerHTML = html;
        }

        function displayPage() {
            var s = (currentPage - 1) * ITEMS_PER_PAGE, e = s + ITEMS_PER_PAGE;
            allRows.forEach(function(row, i) { row.style.display = (i >= s && i < e) ? '' : 'none'; });
            renderPagination(allRows.length);
        }

        window.adminGoToPage = function(page) {
            var total = Math.ceil(allRows.length / ITEMS_PER_PAGE);
            if (page < 1 || page > total) return;
            currentPage = page;
            displayPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        document.addEventListener('DOMContentLoaded', function() {
            var tbody = document.getElementById('admin-catalog-tbody');
            if (!tbody) return;
            allRows = Array.from(tbody.querySelectorAll('.admin-catalog-row'));
            if (allRows.length > ITEMS_PER_PAGE) displayPage();
        });
    })();
    </script>
</body>
</html>
