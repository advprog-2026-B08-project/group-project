<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="current-user-id" th:content="${currentUserId != null ? currentUserId : ''}">
    <title>Catalog List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

<div class="container my-2">
    <h2>Catalog List</h2>
    <a th:href="@{/homepage}" class="btn btn-secondary btn-sm mb-3">Back to Home</a>
    <a th:href="@{/catalog/my}" class="btn btn-primary btn-sm mb-3">My Catalog</a>

    <div class="card mb-3">
        <div class="card-body">
            <form id="catalog-search-form" class="form-row align-items-end">
                <div class="form-group col-md-10 mb-2">
                    <label for="catalogSearchInput">Search</label>
                    <input type="text" class="form-control" id="catalogSearchInput" placeholder="Baju bola SiSeSa FC">
                </div>
                <div class="form-group col-md-2 mb-2 d-flex" style="gap: 0.5rem;">
                    <button type="submit" class="btn btn-info btn-block">Search</button>
                    <button type="button" id="catalog-search-reset" class="btn btn-outline-secondary btn-block">Reset</button>
                </div>
            </form>
        </div>
    </div>

    <table border="1" class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th scope="col">Image</th>
            <th scope="col">Product Name</th>
            <th scope="col">Description</th>
            <th scope="col">Price</th>
            <th scope="col">Stock</th>
            <th scope="col">Origin Location</th>
            <th scope="col">Travel Date</th>
            <th scope="col">Jastiper</th>
            <th scope="col">Order Test</th>
        </tr>
        </thead>
        <tbody id="catalog-table-body">
        <tr th:if="${catalogs.isEmpty()}" id="catalog-empty-row">
            <td colspan="9" class="text-center text-muted">
                <em>No products available yet</em>
            </td>
        </tr>
        <tr th:each="catalog : ${catalogs}" th:attr="data-catalog-id=${catalog.id}">
            <td>
                <img th:if="${catalog.imageUrl != null and !catalog.imageUrl.isEmpty()}"
                     th:src="${catalog.imageUrl}"
                     alt="Product Image"
                     style="width: 80px; height: 80px; object-fit: cover;">
                <span th:if="${catalog.imageUrl == null or catalog.imageUrl.isEmpty()}" class="text-muted">No image</span>
            </td>
            <td th:text="${catalog.name}"></td>
            <td th:text="${catalog.description}"></td>
            <td th:text="${'Rp ' + #numbers.formatDecimal(catalog.price, 0, 'COMMA', 2, 'POINT')}"></td>
            <td th:id="${'stock-' + catalog.id}" th:text="${catalog.stock}"></td>
            <td th:text="${catalog.originLocation}"></td>
            <td th:text="${catalog.travelDate != null ? #temporals.format(catalog.travelDate, 'dd MMM yyyy') : '-'}"></td>
            <td>
                <a th:href="@{/catalog/{userId}(userId=${catalog.jastiperId})}"
                   class="text-primary font-weight-bold"
                   th:text="${catalog.jastiperUsername}"></a>
            </td>
            <td>
                <div class="d-flex" style="gap: 0.5rem;">
                    <input type="number"
                           min="1"
                           value="1"
                           class="form-control form-control-sm"
                           style="width: 85px;"
                           th:id="${'qty-' + catalog.id}">
                    <button class="btn btn-success btn-sm"
                            th:data-catalog-id="${catalog.id}"
                            onclick="submitOrderTest(this.dataset.catalogId)">
                        Order Test
                    </button>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
<script th:src="@{/catalog/js/catalog.js}" defer></script>
</body>
</html>
