<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="current-user-id" th:content="${currentUserId != null ? currentUserId : ''}">
    <title>Catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>

<body class="catalog-body">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="catalog-shell">
        <!-- Hero Header -->
        <div class="catalog-hero">
            <div>
                <span class="eyebrow">Katalog Produk</span>
                <h1>Temukan Produk Jastip Favoritmu</h1>
                <p class="hero-subtitle">Jelajahi semua produk dari jastiper terpercaya. Pesan langsung dari katalog.
                </p>
            </div>
            <div class="hero-actions">
                <a th:if="${userRole != null and (userRole == 'ROLE_JASTIPER' or userRole == 'JASTIPER')}" th:href="@{/catalog/my}"
                    class="btn-primary-pill">📦 My Catalog</a>
                <a href="/homepage" class="btn-ghost">← Kembali</a>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="catalog-search">
            <input type="text" id="catalogSearchInput" placeholder="Cari produk... contoh: Baju bola SiSeSa FC">
            <button type="button" id="catalog-search-submit" class="search-btn" onclick="handleSearchBtn()">🔍
                Cari</button>
            <button type="button" id="catalog-search-reset" class="reset-btn">Reset</button>
        </div>

        <!-- Product Grid -->
        <div class="catalog-grid" id="catalog-grid">
            <th:block th:if="${catalogs.isEmpty()}">
                <div class="catalog-empty" style="grid-column: 1 / -1;">
                    <span class="catalog-empty-icon">🛍️</span>
                    <p>Belum ada produk tersedia.</p>
                    <a href="/homepage" class="btn-ghost" style="display: inline-block;">Kembali ke Home</a>
                </div>
            </th:block>

            <th:block th:each="catalog : ${catalogs}">
                <div class="catalog-card" th:attr="data-catalog-id=${catalog.id}">
                    <div class="catalog-card-image">
                        <img th:if="${catalog.imageUrl != null and !catalog.imageUrl.isEmpty()}"
                            th:src="${catalog.imageUrl}" alt="Product Image">
                        <span th:if="${catalog.imageUrl == null or catalog.imageUrl.isEmpty()}"
                            class="no-image">📷</span>
                    </div>
                    <div class="catalog-card-body">
                        <div class="catalog-card-name" th:text="${catalog.name}"></div>
                        <div class="catalog-card-desc" th:text="${catalog.description}"></div>
                        <div class="catalog-card-meta">
                            <span class="meta-chip location" th:text="'📍 ' + ${catalog.originLocation}"></span>
                            <span class="meta-chip date"
                                th:text="'📅 ' + ${catalog.travelDate != null ? #temporals.format(catalog.travelDate, 'dd MMM yyyy') : '-'}"></span>
                        </div>
                        <div class="catalog-card-rating">
                            <span th:with="avg=${catalog.ratingAverage != null ? catalog.ratingAverage : 0.0}">
                                <span th:style="${avg >= 0.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                                <span th:style="${avg >= 1.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                                <span th:style="${avg >= 2.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                                <span th:style="${avg >= 3.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                                <span th:style="${avg >= 4.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                            </span>
                            <span class="rating-count"
                                th:text="'(' + (catalog.ratingCount != null ? catalog.ratingCount : 0) + ')'"></span>
                        </div>
                        <div style="margin-top: auto; padding-top: 6px;">
                            <a th:href="@{/catalog/{userId}(userId=${catalog.jastiperId})}" class="jastiper-link"
                                th:text="'👤 ' + ${catalog.jastiperUsername}"></a>
                        </div>
                    </div>
                    <div class="catalog-card-footer">
                        <div>
                            <div class="catalog-card-price"
                                th:text="'Rp ' + ${#numbers.formatDecimal(catalog.price, 0, 'COMMA', 0, 'POINT')}">
                            </div>
                            <span class="stock-badge" th:id="'stock-' + ${catalog.id}"
                                th:classappend="${catalog.stock <= 0 ? 'out' : ''}"
                                th:text="${catalog.stock > 0 ? 'Stok: ' + catalog.stock : 'Habis'}"></span>
                        </div>
                        <div th:if="${currentUserId != null and currentUserId == catalog.jastiperId.toString()}"
                            class="own-product-actions">
                            <span class="own-badge">✨ Produk Kamu</span>
                            <a th:href="@{/catalog/edit/{id}(id=${catalog.id})}" class="edit-own-btn">✏️ Edit</a>
                        </div>
                        <a th:if="${currentUserId == null or currentUserId != catalog.jastiperId.toString()}"
                            th:href="@{/order/checkout/{productId}(productId=${catalog.id})}" class="order-btn">🛒
                            Order</a>
                    </div>
                </div>
            </th:block>
        </div>
    </main>

    <script th:src="@{/catalog/js/catalog.js}" defer></script>
</body>

</html>
