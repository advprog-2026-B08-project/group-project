<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="current-user-id" th:content="${currentUserId != null ? currentUserId : ''}">
    <title>Katalog Produk — JSON</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="me-container me-page">
        <!-- Header -->
        <div class="me-page-header" style="margin-bottom: 32px;">
            <div>
                <span style="text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.75rem; font-weight: 800; color: var(--me-text-secondary); display: block; margin-bottom: 6px;">Marketplace</span>
                <h1 style="font-size: 2.5rem; font-weight: 900; margin: 0;">Katalog Produk</h1>
                <p style="color: var(--me-text-secondary); margin-top: 6px; margin-bottom: 0;">Temukan produk unik dari seluruh dunia yang ditawarkan oleh Jastiper terpercaya.</p>
            </div>
            <div style="display: flex; gap: 8px;">
                <a th:href="@{/homepage}" class="me-btn me-btn--outline">← Beranda</a>
                <a th:if="${user != null and user.role == 'ROLE_JASTIPER'}"
                   th:href="@{/catalog/my}" class="me-btn me-btn--primary">📦 Katalog Saya</a>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="me-card me-card--flat" style="padding: 16px 20px; margin-bottom: 24px;">
            <form id="catalog-search-form" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 250px;">
                    <input type="text" id="catalogSearchInput" class="me-input" placeholder="Cari produk, e.g. Baju Bola, Cokelat..." style="width: 100%;">
                </div>
                <button type="submit" class="me-btn me-btn--primary">Cari</button>
                <button type="button" id="catalog-search-reset" class="me-btn me-btn--outline">Reset</button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="catalog-loading" class="me-card me-center" style="padding: 48px; border-style: dashed; background: var(--me-surface);">
            <span style="font-size: 2.5rem; display: block; margin-bottom: 12px;">⏳</span>
            <p style="font-weight: 700; color: var(--me-text-secondary); margin: 0;">Memuat produk...</p>
        </div>

        <!-- Product Card Grid -->
        <div class="catalog-card-grid" id="catalog-grid" style="display: none;">
            <!-- Cards rendered by JS -->
        </div>

        <!-- Pagination -->
        <nav class="catalog-paging" id="catalog-pagination" aria-label="Pagination">
            <!-- Pagination rendered by JS -->
        </nav>
    </main>

    <script th:src="@{/catalog/js/catalog.js}" defer></script>
</body>

</html>
