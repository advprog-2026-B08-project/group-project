<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>
<body class="catalog-body">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="catalog-shell">
    <!-- Hero Header -->
    <div class="catalog-hero">
        <div>
            <span class="eyebrow">My Catalog</span>
            <h1>Kelola Produk Kamu</h1>
            <p class="hero-subtitle">Selamat datang, <strong th:text="${username}">User</strong>! Tambah, edit, dan kelola produk jastip kamu di sini.</p>
        </div>
        <div class="hero-actions">
            <a th:href="@{/catalog/add}" class="btn-primary-pill">➕ Tambah Produk</a>
            <a th:href="@{/catalog}" class="btn-ghost">📋 Semua Katalog</a>
            <a href="/homepage" class="btn-ghost">← Kembali</a>
        </div>
    </div>

    <!-- Product Table -->
    <div class="catalog-table-card">
        <table class="catalog-table">
            <thead>
            <tr>
                <th>Image</th>
                <th>Nama Produk</th>
                <th>Deskripsi</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Asal</th>
                <th>Tanggal</th>
                <th>Aksi</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${catalogs.isEmpty()}">
                <td colspan="8" style="text-align: center; padding: 40px;">
                    <div class="catalog-empty">
                        <span class="catalog-empty-icon">📦</span>
                        <p>Kamu belum menambahkan produk.</p>
                        <a th:href="@{/catalog/add}" class="btn-primary-pill" style="display: inline-flex;">➕ Tambah Produk Pertama</a>
                    </div>
                </td>
            </tr>
            <tr th:each="catalog : ${catalogs}" th:attr="data-catalog-id=${catalog.id}">
                <td>
                    <img th:if="${catalog.imageUrl != null and !catalog.imageUrl.isEmpty()}"
                         th:src="${catalog.imageUrl}" alt="Product Image" class="table-product-img">
                    <div th:if="${catalog.imageUrl == null or catalog.imageUrl.isEmpty()}" class="table-img-placeholder">📷</div>
                </td>
                <td><span class="table-product-name" th:text="${catalog.name}"></span></td>
                <td th:text="${catalog.description}"></td>
                <td class="table-price" th:text="'Rp ' + ${#numbers.formatDecimal(catalog.price, 0, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${catalog.stock}"></td>
                <td th:text="${catalog.originLocation}"></td>
                <td th:text="${catalog.travelDate != null ? #temporals.format(catalog.travelDate, 'dd MMM yyyy') : '-'}"></td>
                <td>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <a th:href="@{/catalog/edit/{id}(id=${catalog.id})}" class="table-action-btn edit">✏️ Edit</a>
                        <button class="table-action-btn delete" th:data-catalog-id="${catalog.id}" onclick="deleteCatalog(this.dataset.catalogId)">🗑️ Hapus</button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:src="@{/catalog/js/my-catalog.js}" defer></script>
</body>
</html>
