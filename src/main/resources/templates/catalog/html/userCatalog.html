<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Catalog</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container my-2">
    <h2>Catalog by <span th:text="${username}">User</span></h2>
    <a th:href="@{/catalog}" class="btn btn-secondary btn-sm mb-3">View All Catalogs</a>
    <a th:href="@{/homepage}" class="btn btn-secondary btn-sm mb-3">Back to Home</a>

    <!-- Jastiper Info Card -->
    <div th:if="${jastiperUser != null and jastiperUser.role == 'ROLE_JASTIPER'}"
         class="card mb-3" style="border-left: 4px solid #2196F3;">
        <div class="card-body d-flex align-items-center justify-content-between">
            <div>
                <h5 class="mb-1">
                    <span th:text="${jastiperUser.username}">Jastiper</span>
                    <span class="badge badge-info">Jastiper</span>
                </h5>
                <small class="text-muted" th:text="${jastiperUser.email}">email</small>
            </div>
            <div class="text-right">
                <div th:if="${jastiperUser.triedToSell > 0}">
                    <strong>Success Rate: </strong>
                    <span class="badge badge-success" style="font-size: 14px;"
                          th:text="${#numbers.formatDecimal(jastiperUser.successRate * 100, 0, 'POINT', 0, 'COMMA') + '%'}">0%</span>
                </div>
                <div th:if="${jastiperUser.triedToSell == 0}" class="text-muted">
                    <small>Belum ada transaksi</small>
                </div>
                <div th:if="${catalogs != null and !catalogs.isEmpty() and catalogs[0].jastiperRatingAverage != null}" class="mt-1">
                    <strong>Rating: </strong>
                    <span th:with="avg=${catalogs[0].jastiperRatingAverage}">
                        <span th:style="${avg >= 0.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                        <span th:style="${avg >= 1.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                        <span th:style="${avg >= 2.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                        <span th:style="${avg >= 3.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                        <span th:style="${avg >= 4.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                    </span>
                    <small class="text-muted"
                           th:text="${'(' + #numbers.formatDecimal(catalogs[0].jastiperRatingAverage, 0, 'POINT', 1, 'COMMA') + '/5)'}"></small>
                </div>
            </div>
        </div>
    </div>

    <table border="1" class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th scope="col">Image</th>
            <th scope="col">Product Name</th>
            <th scope="col">Description</th>
            <th scope="col">Price</th>
            <th scope="col">Rating Produk</th>
            <th scope="col">Stock</th>
            <th scope="col">Origin Location</th>
            <th scope="col">Travel Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${catalogs.isEmpty()}">
            <td colspan="8" class="text-center text-muted">
                <em>This user has no products yet</em>
            </td>
        </tr>
        <tr th:each="catalog : ${catalogs}">
            <td>
                <img th:if="${catalog.imageUrl != null and !catalog.imageUrl.isEmpty()}"
                     th:src="${catalog.imageUrl}"
                     alt="Product Image"
                     style="width: 80px; height: 80px; object-fit: cover;">
                <span th:if="${catalog.imageUrl == null or catalog.imageUrl.isEmpty()}" class="text-muted">No image</span>
            </td>
            <td th:text="${catalog.name}"></td>
            <td th:text="${catalog.description}"></td>
            <td th:text="${'Rp ' + #numbers.formatDecimal(catalog.price, 0, 'COMMA', 2, 'POINT')}"></td>
            <td>
                <span th:with="avg=${catalog.ratingAverage != null ? catalog.ratingAverage : 0.0}">
                    <span th:style="${avg >= 0.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                    <span th:style="${avg >= 1.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                    <span th:style="${avg >= 2.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                    <span th:style="${avg >= 3.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                    <span th:style="${avg >= 4.5 ? 'color: #f5b301;' : 'color: #d0d0d0;'}">&#9733;</span>
                </span>
                <span class="text-muted"
                      th:text="${' (' + (catalog.ratingCount != null ? catalog.ratingCount : 0) + ')'}"></span>
            </td>
            <td th:text="${catalog.stock}"></td>
            <td th:text="${catalog.originLocation}"></td>
            <td th:text="${catalog.travelDate != null ? #temporals.format(catalog.travelDate, 'dd MMM yyyy') : '-'}"></td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnik9KikU7q+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
