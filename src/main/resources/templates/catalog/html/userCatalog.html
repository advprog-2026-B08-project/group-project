<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Jastiper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>
<body class="catalog-body">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="catalog-shell">
    <!-- Hero Header -->
    <div class="catalog-hero">
        <div>
            <span class="eyebrow">Katalog Jastiper</span>
            <h1>Produk dari <span th:text="${username}">User</span></h1>
            <p class="hero-subtitle">Lihat semua produk jastip yang ditawarkan oleh jastiper ini.</p>
        </div>
        <div class="hero-actions">
            <a th:href="@{/catalog}" class="btn-ghost">📋 Semua Katalog</a>
            <a href="/homepage" class="btn-ghost">← Kembali</a>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="catalog-grid">
        <th:block th:if="${catalogs.isEmpty()}">
            <div class="catalog-empty" style="grid-column: 1 / -1;">
                <span class="catalog-empty-icon">📦</span>
                <p>Jastiper ini belum memiliki produk.</p>
                <a th:href="@{/catalog}" class="btn-ghost" style="display: inline-block;">Lihat Semua Katalog</a>
            </div>
        </th:block>

        <th:block th:each="catalog : ${catalogs}">
            <div class="catalog-card">
                <div class="catalog-card-image">
                    <img th:if="${catalog.imageUrl != null and !catalog.imageUrl.isEmpty()}"
                         th:src="${catalog.imageUrl}" alt="Product Image">
                    <span th:if="${catalog.imageUrl == null or catalog.imageUrl.isEmpty()}" class="no-image">📷</span>
                </div>
                <div class="catalog-card-body">
                    <div class="catalog-card-name" th:text="${catalog.name}"></div>
                    <div class="catalog-card-desc" th:text="${catalog.description}"></div>
                    <div class="catalog-card-meta">
                        <span class="meta-chip location" th:text="'📍 ' + ${catalog.originLocation}"></span>
                        <span class="meta-chip date" th:text="'📅 ' + ${catalog.travelDate != null ? #temporals.format(catalog.travelDate, 'dd MMM yyyy') : '-'}"></span>
                    </div>
                </div>
                <div class="catalog-card-footer">
                    <div>
                        <div class="catalog-card-price" th:text="'Rp ' + ${#numbers.formatDecimal(catalog.price, 0, 'COMMA', 0, 'POINT')}"></div>
                        <span class="stock-badge"
                              th:classappend="${catalog.stock <= 0 ? 'out' : ''}"
                              th:text="${catalog.stock > 0 ? 'Stok: ' + catalog.stock : 'Habis'}"></span>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</main>

</body>
</html>
