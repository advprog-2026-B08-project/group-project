<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Catalog — JSON')"></head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="me-container me-page">
        <!-- Page Header -->
        <div class="me-page-header">
            <div>
                <h1>Katalog oleh <span th:text="${username}">User</span></h1>
                <p style="color: var(--me-text-secondary); margin: 4px 0 0 0;">
                    Temukan produk-produk impor/jastip eksklusif yang ditawarkan oleh <strong th:text="${username}">User</strong>.
                </p>
            </div>
            
            <div style="display: flex; gap: 12px;">
                <a th:href="@{/catalog}" class="me-btn me-btn--primary me-btn--sm">Lihat Semua Katalog</a>
                <a th:href="@{/homepage}" class="me-btn me-btn--outline me-btn--sm">Kembali</a>
            </div>
        </div>

        <!-- Table Card -->
        <div class="me-card me-stack" style="padding: 12px; overflow-x: auto;">
            <table class="table me-table" style="margin-bottom: 0;">
                <thead>
                    <tr>
                        <th scope="col" style="width: 100px;">Foto</th>
                        <th scope="col">Nama Produk</th>
                        <th scope="col">Deskripsi</th>
                        <th scope="col">Harga</th>
                        <th scope="col">Stok</th>
                        <th scope="col">Asal Negara</th>
                        <th scope="col">Tgl Keberangkatan</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${catalogs.isEmpty()}">
                        <td colspan="7" class="text-center text-muted" style="padding: 40px 16px;">
                            <span style="font-size: 2rem; display: block; margin-bottom: 8px;">📦</span>
                            <em>Jastiper ini belum memiliki produk</em>
                        </td>
                    </tr>
                    <tr th:each="catalog : ${catalogs}">
                        <td>
                            <img th:if="${catalog.imageUrl != null and !catalog.imageUrl.isEmpty()}"
                                 th:src="${catalog.imageUrl}"
                                 alt="Product Image"
                                 style="width: 70px; height: 70px; object-fit: cover; border-radius: var(--me-radius); border: var(--me-border-w) solid var(--me-border);">
                            <span th:if="${catalog.imageUrl == null or catalog.imageUrl.isEmpty()}" class="text-muted" style="font-size: 0.8rem;">No Image</span>
                        </td>
                        <td style="font-weight: 700;" th:text="${catalog.name}"></td>
                        <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" th:text="${catalog.description}"></td>
                        <td style="font-weight: 700; color: var(--me-text);" th:text="${'Rp ' + #numbers.formatDecimal(catalog.price, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td style="font-weight: 700;" th:text="${catalog.stock}"></td>
                        <td th:text="${catalog.originLocation}"></td>
                        <td th:text="${catalog.travelDate != null ? #temporals.format(catalog.travelDate, 'dd MMM yyyy') : '-'}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnik9KikU7q+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
