<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Produk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>
<body class="catalog-body">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="catalog-shell">
    <!-- Hero Header -->
    <div class="catalog-hero">
        <div>
            <span class="eyebrow">Edit Produk</span>
            <h1>Perbarui Produk</h1>
            <p class="hero-subtitle">Ubah informasi produk jastip kamu sesuai kebutuhan.</p>
        </div>
    </div>

    <!-- Form Card -->
    <div class="catalog-form-card">
        <form th:action="@{/catalog/edit}" th:object="${catalog}" method="post" enctype="multipart/form-data" class="catalog-form">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{imageUrl}">

            <!-- Current Image Preview -->
            <div class="current-image-preview" th:if="${catalog.imageUrl != null and !catalog.imageUrl.isEmpty()}">
                <img th:src="${catalog.imageUrl}" alt="Current Image">
                <span>Gambar saat ini. Upload file baru untuk mengganti.</span>
            </div>

            <label class="field-group">
                <span class="field-label">Nama Produk</span>
                <input th:field="*{name}" type="text" id="nameInput" required placeholder="Masukkan nama produk">
            </label>

            <label class="field-group">
                <span class="field-label">Deskripsi</span>
                <textarea th:field="*{description}" id="descriptionInput" rows="3" placeholder="Deskripsikan produk kamu"></textarea>
            </label>

            <label class="field-group">
                <span class="field-label">Gambar Baru (Opsional)</span>
                <input type="file" name="file" id="fileInput" accept="image/*">
            </label>

            <label class="field-group">
                <span class="field-label">Harga (Rp)</span>
                <input th:field="*{price}" type="number" step="0.01" min="0" id="priceInput" required placeholder="Contoh: 150000">
            </label>

            <label class="field-group">
                <span class="field-label">Stok</span>
                <input th:field="*{stock}" type="number" min="0" id="stockInput" required placeholder="Jumlah stok tersedia">
            </label>

            <label class="field-group">
                <span class="field-label">Lokasi Asal</span>
                <input th:field="*{originLocation}" type="text" id="locationInput" required placeholder="Contoh: Tokyo, Jepang">
            </label>

            <label class="field-group">
                <span class="field-label">Tanggal Perjalanan</span>
                <input th:field="*{travelDate}" type="date" id="dateInput" required>
            </label>

            <div class="catalog-form-actions">
                <button type="submit" class="submit-btn">💾 Simpan Perubahan</button>
                <a th:href="@{/catalog/my}" class="cancel-link">Batal</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
