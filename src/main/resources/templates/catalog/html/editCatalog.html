<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Edit Katalog — JSON')"></head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    
    <div class="me-container me-page" style="max-width: 800px;">
        <div class="me-page-header">
            <div>
                <h1>Edit Produk</h1>
                <p style="color: var(--me-text-secondary); margin: 4px 0 0 0;">Perbarui detail produk titipan Anda.</p>
            </div>
            <a th:href="@{/catalog/my}" class="me-btn me-btn--secondary me-btn--sm">← Katalog Saya</a>
        </div>

        <div class="me-card">
            <form th:action="@{/catalog/edit}" th:object="${catalog}" method="post" enctype="multipart/form-data" class="me-stack" style="gap: 20px;">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{imageUrl}">

                <div class="row">
                    <!-- Product Name -->
                    <div class="col-md-6 form-group">
                        <label for="nameInput">Nama Produk</label>
                        <input th:field="*{name}" type="text" class="form-control" id="nameInput" required placeholder="Contoh: Cokelat Swiss Premium">
                    </div>
                    
                    <!-- Price -->
                    <div class="col-md-6 form-group">
                        <label for="priceInput">Harga (Rp)</label>
                        <input th:field="*{price}" type="number" step="0.01" min="0" class="form-control" id="priceInput" required placeholder="Contoh: 150000">
                    </div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="descriptionInput">Deskripsi Produk</label>
                    <textarea th:field="*{description}" class="form-control" id="descriptionInput" rows="4" placeholder="Jelaskan detail produk, ukuran, berat, dll..."></textarea>
                </div>

                <div class="row">
                    <!-- Stock -->
                    <div class="col-md-4 form-group">
                        <label for="stockInput">Stok Tersedia</label>
                        <input th:field="*{stock}" type="number" min="0" class="form-control" id="stockInput" required placeholder="10">
                    </div>
                    
                    <!-- Origin Location -->
                    <div class="col-md-4 form-group">
                        <label for="locationInput">Negara / Kota Asal</label>
                        <input th:field="*{originLocation}" type="text" class="form-control" id="locationInput" required placeholder="Swiss">
                    </div>

                    <!-- Travel Date -->
                    <div class="col-md-4 form-group">
                        <label for="dateInput">Tanggal Kepulangan</label>
                        <input th:field="*{travelDate}" type="date" class="form-control" id="dateInput" required>
                    </div>
                </div>

                <!-- File Upload -->
                <div class="form-group">
                    <label for="fileInput">Ubah Foto Produk (Opsional)</label>
                    
                    <!-- Show preview if image exists -->
                    <div th:if="${catalog.imageUrl != null and !catalog.imageUrl.isEmpty()}" style="margin-bottom: 12px; display: flex; align-items: center; gap: 12px;">
                        <img th:src="${catalog.imageUrl}" style="width: 80px; height: 80px; object-fit: cover; border-radius: var(--me-radius); border: var(--me-border-w) solid var(--me-border);">
                        <span style="font-size: 0.85rem; color: var(--me-text-secondary); font-weight: 600;">Foto saat ini. Upload foto baru untuk menggantinya.</span>
                    </div>

                    <div style="border: 2px dashed var(--me-border); border-radius: var(--me-radius); padding: 20px; text-align: center; background: var(--me-bg); position: relative;">
                        <span style="font-size: 1.8rem; display: block; margin-bottom: 8px;">📷</span>
                        <input type="file" name="file" class="form-control-file" id="fileInput" accept="image/*" style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer;">
                        <span id="file-upload-filename" style="font-weight: 700; font-size: 0.9rem; color: var(--me-text);">Pilih atau seret foto baru untuk mengganti</span>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; border-top: 2px solid var(--me-border); padding-top: 20px; margin-top: 10px;">
                    <a th:href="@{/catalog/my}" class="me-btn me-btn--secondary">Batal</a>
                    <button type="submit" class="me-btn me-btn--primary">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // Simple file label update listener
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : "Pilih atau seret foto baru untuk mengganti";
            document.getElementById('file-upload-filename').textContent = fileName;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnik9KikU7q+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
