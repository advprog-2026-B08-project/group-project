<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Catalog</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

<div class="container my-2">
    <h2>Edit Catalog</h2>
    <form th:action="@{/catalog/edit}" th:object="${catalog}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{imageUrl}">

        <div class="form-group row">
            <label for="nameInput" class="col-sm-2 col-form-label">Product Name</label>
            <div class="col-sm-10">
                <input th:field="*{name}" type="text" class="form-control mb-4 col-4" id="nameInput" required placeholder="Enter product name">
            </div>
        </div>

        <div class="form-group row">
            <label for="descriptionInput" class="col-sm-2 col-form-label">Description</label>
            <div class="col-sm-10">
                <textarea th:field="*{description}" class="form-control mb-4 col-4" id="descriptionInput" rows="3" placeholder="Enter product description"></textarea>
            </div>
        </div>

        <div class="form-group row">
            <label for="fileInput" class="col-sm-2 col-form-label">Image</label>
            <div class="col-sm-10">
                <input type="file" name="file" class="form-control mb-4 col-4" id="fileInput" accept="image/*">
            </div>
        </div>

        <div class="form-group row">
            <label for="priceInput" class="col-sm-2 col-form-label">Price</label>
            <div class="col-sm-10">
                <input th:field="*{price}" type="number" step="0.01" class="form-control mb-4 col-4" min="0" id="priceInput" required placeholder="Enter price">
            </div>
        </div>

        <div class="form-group row">
            <label for="stockInput" class="col-sm-2 col-form-label">Stock</label>
            <div class="col-sm-10">
                <input th:field="*{stock}" type="number" class="form-control mb-4 col-4" min="0" id="stockInput" required placeholder="Enter stock">
            </div>
        </div>

        <div class="form-group row">
            <label for="locationInput" class="col-sm-2 col-form-label">Origin Location</label>
            <div class="col-sm-10">
                <input th:field="*{originLocation}" type="text" class="form-control mb-4 col-4" id="locationInput" placeholder="Enter origin location">
            </div>
        </div>

        <div class="form-group row">
            <label for="dateInput" class="col-sm-2 col-form-label">Travel Date</label>
            <div class="col-sm-10">
                <input th:field="*{travelDate}" type="date" class="form-control mb-4 col-4" id="dateInput" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Update Catalog</button>
        <a th:href="@{/catalog/my}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnik9KikU7q+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
