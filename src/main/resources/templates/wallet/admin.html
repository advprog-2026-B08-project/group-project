<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Admin — JSON</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="me-container me-page wallet-shell wallet-admin-shell">
    <!-- Hero / Header -->
    <div class="me-page-header" style="margin-bottom: 32px;">
        <div>
            <span style="text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.75rem; font-weight: 800; color: var(--me-text-secondary); display: block; margin-bottom: 6px;">Admin Portal</span>
            <h1 style="font-size: 2.5rem; font-weight: 900; margin: 0;">Monitoring Payment</h1>
            <p style="color: var(--me-text-secondary); margin-top: 6px; margin-bottom: 0;">Verifikasi transaksi pending dan pantau arus dana secara real time.</p>
        </div>
        <div>
            <button id="refresh-admin" class="me-btn me-btn--outline">🔄 Refresh</button>
        </div>
    </div>

    <!-- Table Section -->
    <div class="me-card" style="padding: 24px; overflow-x: auto;">
        <table class="me-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>User ID</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="admin-table-body">
                <tr>
                    <td colspan="6" class="me-center" style="padding: 32px; color: var(--me-text-secondary); font-weight: 600;">
                        Belum ada transaksi.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
(() => {
    const tableBody = document.getElementById("admin-table-body");
    const refreshButton = document.getElementById("refresh-admin");

    const formatIdr = (value) => {
        const numeric = Number(value);
        if (Number.isNaN(numeric)) {
            return "Rp 0";
        }
        return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(numeric);
    };

    const renderRows = (items) => {
        tableBody.innerHTML = "";
        if (!items || items.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="6" class="me-center" style="padding: 32px; color: var(--me-text-secondary); font-weight: 600;">
                        Belum ada transaksi.
                    </td>
                </tr>
            `;
            return;
        }

        items.forEach((item) => {
            const row = document.createElement("tr");

            const status = String(item.status || "-");
            const statusUpper = status.toUpperCase();

            // Status mapping to neobrutalist badges
            let badgeClass = "me-badge--info";
            if (statusUpper === "SUCCESS" || statusUpper === "COMPLETED") {
                badgeClass = "me-badge--success";
            } else if (statusUpper === "PENDING") {
                badgeClass = "me-badge--warning";
            } else if (statusUpper === "FAILED" || statusUpper === "CANCELLED") {
                badgeClass = "me-badge--danger";
            }

            const actionButtons = status === "PENDING"
                ? `
                    <div style="display: flex; gap: 8px;">
                        <button class="me-btn me-btn--success me-btn--sm" data-id="${item.id}" data-status="SUCCESS" style="padding: 4px 8px; font-size: 0.75rem;">Success</button>
                        <button class="me-btn me-btn--danger me-btn--sm" data-id="${item.id}" data-status="FAILED" style="padding: 4px 8px; font-size: 0.75rem;">Failed</button>
                    </div>
                  `
                : `<span class="me-badge ${badgeClass}" style="font-size: 0.7rem; padding: 2px 8px; border-width: 1px;">${status}</span>`;

            row.innerHTML = `
                <td style="font-family: monospace; font-size: 0.85rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.id}</td>
                <td style="font-family: monospace; font-size: 0.85rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.userId}</td>
                <td style="font-weight: 700;">${item.type}</td>
                <td style="font-weight: 800; color: var(--me-text);">${formatIdr(item.amount)}</td>
                <td><span class="me-badge ${badgeClass}" style="font-size: 0.7rem; padding: 2px 8px; border-width: 1px;">${status}</span></td>
                <td>${actionButtons}</td>
            `;

            tableBody.appendChild(row);
        });
    };

    const loadTransactions = async () => {
        try {
            const response = await fetch("/api/admin/wallet/transactions");
            if (!response.ok) {
                throw new Error("Failed to load admin data");
            }
            const data = await response.json();
            renderRows(data);
        } catch (error) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="6" class="me-center" style="padding: 32px; color: var(--me-danger); font-weight: 600;">
                        Gagal memuat transaksi.
                    </td>
                </tr>
            `;
        }
    };

    const updateStatus = async (transactionId, status) => {
        try {
            const response = await fetch(`/api/admin/wallet/transactions/${transactionId}/status`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ status })
            });
            if (!response.ok) {
                throw new Error("Failed to update status");
            }
            await loadTransactions();
        } catch (error) {
            alert("Update status gagal.");
        }
    };

    tableBody.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) {
            return;
        }
        const transactionId = button.getAttribute("data-id");
        const status = button.getAttribute("data-status");
        updateStatus(transactionId, status);
    });

    refreshButton.addEventListener("click", loadTransactions);
    loadTransactions();
})();
</script>
</body>
</html>
