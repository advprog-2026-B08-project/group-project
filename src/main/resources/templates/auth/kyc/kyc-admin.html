<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Pengajuan Admin — JSON')"></head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    
    <div class="me-container me-page" style="max-width: 600px;">
        <!-- Form Section -->
        <div th:if="${user.status != 'PENDING'}" class="me-card me-stack" style="padding: 32px 24px;">
            <div style="text-align: center; margin-bottom: 16px;">
                <span style="font-size: 2.5rem; display: block; margin-bottom: 8px;">🔑</span>
                <h2>Gabung Sebagai Admin</h2>
                <p style="color: var(--me-text-secondary); font-size: 0.9rem; margin: 0;">
                    Lengkapi data diri Anda untuk mengajukan promosi akun menjadi Administrator sistem.
                </p>
            </div>

            <form th:action="@{/kycRequestAdmin}" method="post" class="me-stack" style="gap: 16px;">
                <div>
                    <label for="emailInput">Email</label>
                    <input id="emailInput" name="email" type="email" placeholder="contoh@email.com" required class="form-control">
                </div>

                <div>
                    <label for="fullNameInput">Nama Lengkap</label>
                    <input id="fullNameInput" name="fullName" type="text" placeholder="Masukkan nama lengkap Anda" required class="form-control">
                </div>

                <div>
                    <label for="phoneNumberInput">Nomor Telepon</label>
                    <input id="phoneNumberInput" name="phoneNumber" type="tel" placeholder="08xxxxxxxxxx" required class="form-control">
                </div>

                <div>
                    <label for="socialsInput">Tautan Media Sosial / Portofolio</label>
                    <input id="socialsInput" name="socials" type="url" placeholder="https://www.instagram.com/username" required class="form-control">
                </div>

                <div style="margin-top: 8px;">
                    <button type="submit" id="submitButton" class="me-btn me-btn--primary me-btn--block me-btn--lg">Kirim Pengajuan Admin</button>
                </div>
            </form>
        </div>

        <!-- Pending State Section -->
        <div th:if="${user.status == 'PENDING'}" class="me-card text-center" style="padding: 48px 32px;">
            <div style="width: 80px; height: 80px; border-radius: 50%; border: var(--me-border-w) solid var(--me-success); background: var(--me-success-bg); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto;">
                <span style="font-size: 2rem; color: var(--me-success);">✓</span>
            </div>
            <h2 style="margin-bottom: 8px;">Pengajuan Terkirim!</h2>
            <p style="color: var(--me-text-secondary); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5;">
                Data pengajuan Admin Anda berhasil diunggah. Mohon tunggu proses review oleh tim Administrator utama kami.
            </p>
            <a th:href="@{/homepage}" class="me-btn me-btn--secondary me-btn--sm">Kembali ke Beranda</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
