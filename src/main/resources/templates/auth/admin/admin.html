<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin page</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERd`knLPMO" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <!-- TODO : sections (user list (done), promotion request (done), log) -->
    <div class="container mt-5">
        <div class="justify-content-center">
            <h1 style="margin-bottom: 40px; font-family: 'Arial Black'">Admin dashboard</h1>
            <div class="col md-3 containerRowGray">
                <div class="col md-3 contents">
                    <div style="margin-bottom: 20px">
                        <a th:href="@{/admin/userList}"><h2>User List</h2></a>
                    </div>
                    <div class="containerRowWhite">
                        <div>
                            <p>Admin</p>
                            <p class="bigNum" th:text="${roleCount.get('ROLE_ADMIN') ?: 0}"></p>
                        </div>
                        <div>
                            <p>Jastiper</p>
                            <p class="bigNum" th:text="${roleCount.get('ROLE_ADMIN') ?: 0}"></p>
                        </div>
                        <div>
                            <p>Titiper</p>
                            <p class="bigNum" th:text="${roleCount.get('ROLE_ADMIN') ?: 0    }"></p>
                        </div>
                    </div>
                </div>
                <div class="col md-3 contents">
                    <div style="margin-bottom: 20px">
                        <a th:href="@{/admin/kycRequestList}"><h2>KYC requests</h2></a>
                    </div>
                    <div class="containerRowWhite" style="justify-content: center">
                        <div>
                            <p>Pending requests</p>
                            <p class="bigNum" th:text="${requestCount.get('PENDING') ?: 0}"></p>
                        </div>
                    </div>
                </div>
                <div class="col md-3 contents">
                    <div>
                        <h2>Logs</h2>
                    </div>
                    <div style="font-family: Arial">

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
