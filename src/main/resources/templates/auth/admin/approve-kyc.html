<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kyc Requests</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERd`knLPMO" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <!-- TODO: For admin to approve kyc-->
    <div class="container mt-4 justify-content-center">

        <h1 style="font-family: 'Arial Black'; margin-bottom: 40px">KYC Requests</h1>
        <div class="kyc-box">

            <div class="kyc-left">
                <div style="margin: auto">
                    <p style="text-align: center; font-weight: bold">Pending requests</p>
                    <p class="bigNum" th:text="${requestCount.get('ACTIVE') ?: 0}"></p>
                </div>
            </div>

            <div class="kyc-mid">
                <div th:each="req : ${requestList}" class="request-card">
                    <a th:href="@{/admin/kycRequestList(selectedId = ${req.getId()})}">
                        <span class="username" th:text="${req.user.username}">Username</span>
                    </a>
                    <div class="actions">
                        <form th:action="@{/admin/kyc/accept}" method="post"
                        onsubmit="return confirm('Are you sure you want to accept this users application?')">
                            <input type="hidden" name="requestId" th:value="${req.getId()}" />
                            <button class="btn btn-success btn-sm">Accept</button>
                        </form>

                        <form th:action="@{/admin/kyc/reject}" method="post"
                        onsubmit="return confirm('Are you sure you want to reject this users application?')">
                            <input type="hidden" name="requestId" th:value="${req.getId()}" />
                            <button class="btn btn-danger btn-sm">Reject</button>
                        </form>
                    </div>

                </div>
            </div>

            <div class="kyc-right">
                <div class="flex flexDown justifyBetween alignCenter" th:if="${selectedRequest != null}">
                    <div>
                        <p style="font-family: 'Arial Black'; font-size: 20px" th:text="${selectedRequest.getFullName()}"></p>
                        <p style="color: #606060; font-weight: bold; margin-bottom: 120px" th:text="${selectedRequest.getEmail()}"></p>
                    </div>
                    <div>
                        <p style="font-weight: bold" th:text="${selectedRequest.getSocials()}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
