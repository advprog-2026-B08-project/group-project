<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('User List — JSON')"></head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="me-container me-page">
        <div class="me-page-header">
            <div>
                <h1>Daftar Pengguna</h1>
                <p style="color: var(--me-text-secondary); margin: 4px 0 0 0;">Kelola akun, role, dan hak akses pengguna aplikasi.</p>
            </div>
            <a th:href="@{/admin}" class="me-btn me-btn--secondary me-btn--sm">← Dashboard</a>
        </div>

        <div class="me-grid me-grid--3" style="align-items: stretch; gap: 20px;">
            <div th:each="userInList : ${userList}"
                 th:if="${user.role == 'ROLE_ADMIN' or userInList.role != 'ROLE_ADMIN'}"
                 class="me-card me-stack"
                 style="justify-content: space-between; padding: 20px; min-height: 280px; position: relative;">

                <div>
                    <!-- Top header: avatar and badges -->
                    <div style="display: flex; gap: 16px; align-items: start; margin-bottom: 16px;">
                        <img th:src="${userInList.profilePictureURL != null} ? ${userInList.profilePictureURL} : '/images/defaultProfilePicture.png'"
                             onerror="this.onerror=null; this.src='/images/defaultProfilePicture.png';"
                             style="height: 64px; width: 64px; object-fit: cover; border-radius: 50%; border: var(--me-border-w) solid var(--me-border);">

                        <div class="me-stack" style="gap: 4px; flex: 1;">
                            <!-- Role Badges -->
                            <div>
                                <span th:if="${userInList.role == 'ROLE_ADMIN'}" class="me-badge me-badge--info" style="font-size: 0.65rem; padding: 2px 8px;">Admin</span>
                                <span th:if="${userInList.role == 'ROLE_JASTIPER'}" class="me-badge me-badge--success" style="font-size: 0.65rem; padding: 2px 8px;">Jastiper</span>
                                <span th:if="${userInList.role == 'ROLE_TITIPER'}" class="me-badge me-badge--dark" style="font-size: 0.65rem; padding: 2px 8px;">Titiper</span>
                            </div>

                            <!-- Status Badges -->
                            <div>
                                <span th:if="${userInList.status == 'ACTIVE'}" class="me-badge me-badge--success" style="font-size: 0.6rem; padding: 1px 6px;">Aktif</span>
                                <span th:if="${userInList.status == 'PENDING'}" class="me-badge me-badge--warning" style="font-size: 0.6rem; padding: 1px 6px;">Pending</span>
                                <span th:if="${userInList.status == 'BANNED'}" class="me-badge me-badge--danger" style="font-size: 0.6rem; padding: 1px 6px;">Banned</span>
                            </div>
                        </div>
                    </div>

                    <!-- User Information -->
                    <div>
                        <h2 style="font-size: 1.3rem; margin-bottom: 2px; line-height: 1.2;" th:text="${userInList.username}"></h2>
                        <p style="font-size: 0.85rem; font-weight: 600; color: var(--me-text-secondary); margin: 0 0 4px 0;" th:text="${userInList.fullName}"></p>
                        <p style="font-size: 0.8rem; color: var(--me-text-muted); margin: 0;" th:text="${userInList.email}"></p>
                    </div>

                    <!-- Success rate for Jastipers -->
                    <div th:if="${userInList.role == 'ROLE_JASTIPER'}" style="margin-top: 12px; border-top: 1px dashed rgba(26,26,26,0.1); padding-top: 8px;">
                        <span style="font-size: 0.8rem; font-weight: 700; color: var(--me-text-secondary);">
                            ⭐ Success Rate: <span th:text="${#numbers.formatDecimal(userInList.getSuccessRate() * 100, 0, 'POINT', 0, 'COMMA')} + '%'">100%</span>
                        </span>
                    </div>
                </div>

                <!-- Admin Action Buttons at the bottom -->
                <div th:if="${user.role == 'ROLE_ADMIN' && userInList.role != 'ROLE_ADMIN'}"
                     style="display: flex; gap: 8px; margin-top: 20px; border-top: 2px solid var(--me-border); padding-top: 16px;">

                    <!-- Ban/Lift Ban Button -->
                    <div style="flex: 1;">
                        <form th:if="${userInList.status != 'BANNED'}" th:action="@{/admin/ban}" method="post"
                              onsubmit="return confirm('Apakah Anda yakin ingin memblokir (ban) pengguna ini?');">
                            <input type="hidden" name="userId" th:value="${userInList.id}" />
                            <button type="submit" class="me-btn me-btn--danger me-btn--sm me-btn--block">Ban</button>
                        </form>

                        <form th:if="${userInList.status == 'BANNED'}" th:action="@{/admin/liftBan}" method="post"
                              onsubmit="return confirm('Apakah Anda yakin ingin memulihkan (lift ban) pengguna ini?');">
                            <input type="hidden" name="userId" th:value="${userInList.id}" />
                            <button type="submit" class="me-btn me-btn--success me-btn--sm me-btn--block">Lift Ban</button>
                        </form>
                    </div>

                    <!-- Demote Button (Only for Jastiper to Titiper) -->
                    <div th:if="${userInList.role == 'ROLE_JASTIPER'}" style="flex: 1;">
                        <form th:action="@{/admin/demote}" method="post"
                              onsubmit="return confirm('Apakah Anda yakin ingin menurunkan pangkat (demote) Jastiper ini menjadi Titiper?');">
                            <input type="hidden" name="userId" th:value="${userInList.id}" />
                            <button type="submit" class="me-btn me-btn--warning me-btn--sm me-btn--block">Demote</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
