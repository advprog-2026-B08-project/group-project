<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERd`knLPMO" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="fragments/navbar :: navbar"></div>

  <div class="container mt-4">
      <h1 style="font-family: 'Arial Black'; margin-bottom: 40px">User List</h1>
      <div class="row">
          <div class="col-md-4 mb-4" th:each="user : ${userList}">
              <div class="card h-100 shadow-sm" style="border-radius: 12px;">

                  <!-- Profile Picture -->
                  <img th:src="${user.profilePictureURL != null} ? ${user.profilePictureURL} : '/images/defaultProfilePicture.png'"
                       class="card-img-top"
                       style="height: 200px; object-fit: cover; border-top-left-radius: 12px; border-top-right-radius: 12px;">

                  <div class="card-body">
                      <h5 class="card-title" th:text="${user.fullName}">Full Name</h5>
                      <p class="card-text">
                          <strong>Username:</strong>
                          <span th:text="${user.username}"></span>
                      </p>
                      <p class="card-text">
                          <strong>Email:</strong>
                          <span th:text="${user.email}"></span>
                      </p>
                      <p class="card-text">
                          <strong>Role:</strong>
                          <span th:text="${user.role}"></span>
                      </p>
                      <p class="card-text">
                          <strong>Status:</strong>
                          <span th:text="${user.status}"></span>
                      </p>
                  </div>

                  <!-- Actions -->
                  <div class="containerRowWhite">
<!--                      TODO: button demote & ban-->
                  </div>
              </div>
          </div>
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
