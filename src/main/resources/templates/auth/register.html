<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Register — JSON')"></head>
<body>
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--me-bg);">
        <div class="me-card me-card--flat" style="width:100%; max-width:480px;">
            <div style="text-align:center; margin-bottom:24px;">
                <h1 style="font-size:2rem; margin-bottom:4px;">JSON</h1>
                <p style="color:var(--me-text-secondary); font-size:0.9rem;">Buat akun baru</p>
            </div>

            <div th:if="${param.userExists}" class="alert alert-danger" style="font-size:0.85rem;">
                Email sudah terdaftar
            </div>
            <div th:if="${param.error}" class="alert alert-danger" style="font-size:0.85rem;">
                Password tidak cocok
            </div>

            <form th:action="@{/register}" method="post">
                <div style="margin-bottom:14px;">
                    <label for="emailInput">Email</label>
                    <input id="emailInput" name="email" type="email" placeholder="nama@email.com" required class="form-control">
                </div>
                <div style="margin-bottom:14px;">
                    <label for="passwordInput">Password</label>
                    <input id="passwordInput" name="password" type="password" placeholder="Gunakan password yang kuat" required class="form-control">
                </div>
                <div style="margin-bottom:14px;">
                    <label for="confirmPasswordInput">Konfirmasi Password</label>
                    <input id="confirmPasswordInput" name="confirmPassword" type="password" placeholder="Ulangi password" required class="form-control">
                </div>
                <div style="margin-bottom:14px;">
                    <label for="usernameInput">Username</label>
                    <input id="usernameInput" name="username" placeholder="username_123" class="form-control">
                </div>
                <div style="margin-bottom:20px;">
                    <label for="fullName">Nama Lengkap</label>
                    <input id="fullName" name="fullName" type="text" placeholder="John Doe" class="form-control">
                </div>
                <button type="submit" id="registerButton" class="me-btn me-btn--primary me-btn--block me-btn--lg">Daftar</button>
            </form>

            <p style="text-align:center; margin-top:20px; font-size:0.9rem; color:var(--me-text-secondary);">
                Sudah punya akun?
                <a th:href="@{/login}" style="font-weight:700;">Login di sini</a>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
