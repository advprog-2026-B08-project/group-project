<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Edit Profil — JSON')"></head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="me-container me-page">
        <div class="me-page-header">
            <h1>Edit Profil</h1>
        </div>
        
        <div class="me-grid me-grid--2" style="grid-template-columns: 1fr 2fr; gap: 24px; align-items: start;">
            <!-- Left Panel (Avatar) -->
            <div class="me-card text-center" style="padding: 32px 24px;">
                <img th:src="${user.profilePictureURL != null} ? ${user.profilePictureURL} : '/images/defaultProfilePicture.png'"
                     onerror="this.onerror=null; this.src='/images/defaultProfilePicture.png';"
                     class="profile-pic" style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: var(--me-border-w) solid var(--me-border); margin: 0 auto 16px auto; display: block;">
                <h3 th:text="${user.username}" style="margin-bottom: 4px;"></h3>
                <p style="color:var(--me-text-secondary); font-size:0.9rem; margin: 0;" th:text="${user.email}"></p>
            </div>
            
            <!-- Right Panel (Form) -->
            <div class="me-card">
                <form th:action="@{/profile/update}" method="post" class="me-stack" style="gap: 20px;">
                    <div>
                        <label for="username">Username</label>
                        <input id="username" type="text" name="username" th:value="${user.username}" required class="form-control" placeholder="username_baru">
                    </div>

                    <div>
                        <label for="fullName">Nama Lengkap</label>
                        <input id="fullName" type="text" name="fullName" th:value="${user.fullName}" class="form-control" placeholder="Nama Lengkap Anda">
                    </div>

                    <div>
                        <label for="socials">Media Sosial (URL)</label>
                        <input id="socials" type="url" name="socials" th:value="${user.socials}" class="form-control" placeholder="https://instagram.com/username">
                    </div>

                    <div>
                        <label for="ppURL">URL Foto Profil</label>
                        <input id="ppURL" type="url" name="profilePictureURL" th:value="${user.profilePictureURL}" class="form-control" placeholder="https://domain.com/foto.jpg">
                    </div>

                    <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px;">
                        <a th:href="@{/profile}" class="me-btn me-btn--secondary">Batal</a>
                        <button type="submit" class="me-btn me-btn--primary">Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
