<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Profile</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERd`knLPMO" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background: #f0f0f0">
  <div th:replace="fragments/navbar :: navbar"></div>
  <h1>It's a me ~</h1>
  <h1>You thought it was gonna be Mario, but it was me! Dio!</h1>
  <div class="profile-container">

      <div class="profile-left">
          <img th:src="${user.profilePictureURL != null} ? ${user.profilePictureURL} : '/images/defaultProfilePicture.png'"
               class="profile-pic" style="margin-left: 40px">
      </div>

      <div class="profile-right">
          <div class="center2" style="margin-left: 50px">
              <div style="margin-bottom: 50px">
                  <span style="font-family: 'Arial Black'; font-size: 32px"
                     th:text="${user.username}"></span>
                  <br>
                  <span style="color: #606060" th:text="${user.email}"></span>
                  <span style="color: #606060">  |  </span>
                  <span style="color: #606060" th:text="${user.fullName}"></span>
              </div>
              <div>
                  <p style="color: #606060" th:text="${user.socials} ?: '-'">
              </div>
          </div>
      </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
