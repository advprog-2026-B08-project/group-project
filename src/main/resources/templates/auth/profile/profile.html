<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Profil — JSON')"></head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="me-container me-page">
        <div class="me-page-header">
            <h1>Profil</h1>
        </div>
        <div class="profile-container">
            <div class="profile-left">
                <img th:src="${user.profilePictureURL != null} ? ${user.profilePictureURL} : '/images/defaultProfilePicture.png'"
                     onerror="this.onerror=null; this.src='/images/defaultProfilePicture.png';"
                     class="profile-pic">
            </div>
            <div class="profile-right" style="justify-content:center;">
                <div>
                    <h2 style="margin-bottom:4px;" th:text="${user.username}"></h2>
                    <p style="color:var(--me-text-secondary); margin-bottom:4px;">
                        <span th:text="${user.email}"></span>
                        <span th:if="${user.fullName != null}"> · <span th:text="${user.fullName}"></span></span>
                    </p>
                    <p th:if="${user.socials != null}" style="color:var(--me-text-muted); font-size:0.9rem; margin-bottom:20px;">
                        Socials: <span th:text="${user.socials} ?: '-'"></span>
                    </p>
                    <a th:href="@{/profile/edit}" class="me-btn me-btn--primary me-btn--sm">Edit Profil</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
