<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Login — JSON')"></head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--me-bg); padding: 20px;">
        <div class="me-card" style="width: 100%; max-width: 440px; padding: 40px; background: #FFFFFF; transition: none;">
            <div style="text-align: center; margin-bottom: 32px;">
                <span class="me-badge me-badge--dark" style="font-size: 0.75rem; padding: 4px 12px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.1em; display: inline-block;">Jastip Online Nasional</span>
                <h1 style="font-size: 3.5rem; font-weight: 900; letter-spacing: -0.05em; margin: 0; line-height: 1;">JSON</h1>
                <p style="color: var(--me-text-secondary); font-size: 0.95rem; margin-top: 12px; margin-bottom: 0;">Selamat datang kembali! Silakan masuk ke akun Anda.</p>
            </div>

            <!-- Custom Neobrutalist Alerts -->
            <div th:if="${param.error}" style="background: var(--me-danger-bg); border: var(--me-border-w) solid var(--me-danger); border-radius: var(--me-radius); color: #991B1B; font-weight: 700; font-size: 0.85rem; padding: 12px 16px; margin-bottom: 24px; text-align: center;">
                Email atau password yang Anda masukkan salah.
            </div>
            <div th:if="${param.logout}" style="background: var(--me-success-bg); border: var(--me-border-w) solid var(--me-success); border-radius: var(--me-radius); color: #065F46; font-weight: 700; font-size: 0.85rem; padding: 12px 16px; margin-bottom: 24px; text-align: center;">
                Anda telah berhasil keluar dari akun.
            </div>

            <form th:action="@{/login}" method="post" class="me-stack" style="gap: 20px;">
                <div>
                    <label for="emailInput" style="display: block; font-weight: 700; font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--me-text);">Email Address</label>
                    <input id="emailInput" name="username" type="email" placeholder="nama@email.com" required class="form-control" style="height: 48px; font-size: 0.95rem; font-family: var(--me-font);">
                </div>
                <div>
                    <label for="passwordInput" style="display: block; font-weight: 700; font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--me-text);">Password</label>
                    <input id="passwordInput" name="password" type="password" placeholder="Masukkan password Anda" required class="form-control" style="height: 48px; font-size: 0.95rem; font-family: var(--me-font);">
                </div>
                <button type="submit" id="loginButton" class="me-btn me-btn--primary me-btn--block me-btn--lg" style="height: 50px; font-size: 1rem; font-weight: 800; margin-top: 8px; justify-content: center;">
                    Masuk Sekarang →
                </button>
            </form>

            <div style="border-top: 1px dashed var(--me-border); margin: 32px 0 24px 0;"></div>

            <p style="text-align: center; margin: 0; font-size: 0.95rem; color: var(--me-text-secondary);">
                Belum memiliki akun?
                <a th:href="@{/register}" style="font-weight: 800; text-decoration: underline; color: var(--me-text);">Daftar di Sini</a>
            </p>
        </div>
    </div>
</body>
</html>
