<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Login — JSON')"></head>
<body>
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--me-bg);">
        <div class="me-card me-card--flat" style="width:100%; max-width:420px;">
            <div style="text-align:center; margin-bottom:24px;">
                <h1 style="font-size:2rem; margin-bottom:4px;">JSON</h1>
                <p style="color:var(--me-text-secondary); font-size:0.9rem;">Masuk ke akun Anda</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger" style="font-size:0.85rem;">
                Email atau password salah
            </div>
            <div th:if="${param.logout}" class="alert alert-success" style="font-size:0.85rem;">
                Anda telah berhasil logout
            </div>

            <form th:action="@{/login}" method="post">
                <div style="margin-bottom:16px;">
                    <label for="emailInput">Email</label>
                    <input id="emailInput" name="username" type="email" placeholder="nama@email.com" required class="form-control">
                </div>
                <div style="margin-bottom:20px;">
                    <label for="passwordInput">Password</label>
                    <input id="passwordInput" name="password" type="password" placeholder="Masukkan password" required class="form-control">
                </div>
                <button type="submit" id="loginButton" class="me-btn me-btn--primary me-btn--block me-btn--lg">Login</button>
            </form>

            <p style="text-align:center; margin-top:20px; font-size:0.9rem; color:var(--me-text-secondary);">
                Belum punya akun?
                <a th:href="@{/register}" style="font-weight:700;">Daftar di sini</a>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
