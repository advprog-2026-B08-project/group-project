<nav th:fragment="navbar" class="navbar">
    <div class="nav">
        <a th:href="@{/homepage}" class="me-logo">JSON</a>
        <a th:href="@{/catalog}">Katalog</a>
        <a th:href="@{/order/list}">Pesanan</a>
        <a th:href="@{/wallet}">Dompet</a>
        <div th:if="${user.role == 'ROLE_ADMIN'}" style="display:contents">
            <a th:href="@{/admin}">Admin</a>
            <a th:href="@{/admin/wallet}">Wallet Admin</a>
            <a th:href="@{/admin/userList}">User List</a>
            <a th:href="@{/catalog/admin/monitoring}">Monitoring</a>
        </div>
        <a th:if="${user.role == 'ROLE_JASTIPER'}" th:href="@{/catalog/my}">Katalog Saya</a>
    </div>

    <div class="nav">
        <div class="balance-chip" th:if="${user != null}" th:attr="data-user-id=${user.id}">
            <span class="balance-label">Saldo</span>
            <span class="balance-value" id="nav-balance">Rp 0</span>
        </div>
        <a th:href="@{/profile}" class="profile">
            <img th:if="${user != null and user.profilePictureURL != null}"
                 th:src="${user.profilePictureURL}"
                 onerror="this.onerror=null; this.src='/images/defaultProfilePicture.png';"/>
            <img th:if="${user == null or user.profilePictureURL == null}"
                 th:src="@{/images/defaultProfilePicture.png}"
                 onerror="this.onerror=null; this.src='/images/defaultProfilePicture.png';"/>
            <span th:text="${user.username}"></span>
        </a>
        <form th:action="@{/logout}" method="post" style="margin:0">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit" id="logoutButton" class="me-btn me-btn--danger me-btn--sm">Logout</button>
        </form>
    </div>
</nav>

<script>
(() => {
    const chip = document.querySelector(".balance-chip");
    if (!chip) return;

    const userId = chip.getAttribute("data-user-id");
    const valueEl = chip.querySelector(".balance-value");
    if (!userId || !valueEl) return;

    const formatIdr = (value) => {
        const numeric = Number(value);
        if (Number.isNaN(numeric)) return "Rp 0";
        return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(numeric);
    };

    fetch(`/api/wallet/balance/${userId}`)
        .then((response) => response.ok ? response.json() : null)
        .then((data) => {
            if (!data) return;
            valueEl.textContent = formatIdr(data.balance);
        })
        .catch(() => {});
})();
</script>
