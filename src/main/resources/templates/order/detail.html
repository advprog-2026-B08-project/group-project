<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body class="order-body">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="order-shell">
    <!-- Header -->
    <div class="detail-header">
        <a href="/order/list" class="btn-ghost">← Kembali</a>
        <h1>Detail Pesanan</h1>
    </div>

    <div class="detail-grid">
        <!-- LEFT: Order Information -->
        <div>
            <div class="detail-card">
                <div class="detail-status-row">
                    <h3 style="margin: 0;">📋 Informasi Order</h3>
                    <span class="status-badge-lg"
                          th:classappend="${
                              order.status.name() == 'PAID' ? 'status-paid' :
                              (order.status.name() == 'PURCHASED' ? 'status-purchased' :
                              (order.status.name() == 'SHIPPED' ? 'status-shipped' :
                              (order.status.name() == 'COMPLETED' ? 'status-completed' : 'status-cancelled')))
                          }"
                          th:text="${order.status}">PAID</span>
                </div>

                <div class="detail-info-grid">
                    <div class="detail-info-item full-width">
                        <span class="detail-info-label">Order ID</span>
                        <span class="detail-info-value mono" th:text="${order.id}">-</span>
                    </div>
                    <div class="detail-info-item">
                        <span class="detail-info-label">Pembeli</span>
                        <span class="detail-info-value" th:text="${order.buyerUsername != null ? order.buyerUsername : order.buyerId}">-</span>
                    </div>
                    <div class="detail-info-item">
                        <span class="detail-info-label">Jastiper</span>
                        <span class="detail-info-value" th:text="${order.jastiperUsername != null ? order.jastiperUsername : order.jastiperId}">-</span>
                    </div>
                    <div class="detail-info-item full-width">
                        <span class="detail-info-label">Produk</span>
                        <span class="detail-info-value" th:text="${order.productName != null ? order.productName : order.productId}">-</span>
                    </div>
                    <div class="detail-info-item">
                        <span class="detail-info-label">Jumlah</span>
                        <span class="detail-info-value" th:text="${order.quantity + ' pcs'}">-</span>
                    </div>
                    <div class="detail-info-item full-width">
                        <span class="detail-info-label">Total Harga</span>
                        <span class="detail-info-value price"
                              th:text="${'Rp ' + #numbers.formatDecimal(order.totalPrice, 0, 'POINT', 0, 'COMMA')}">-</span>
                    </div>
                    <div class="detail-info-item full-width">
                        <span class="detail-info-label">Alamat Pengiriman</span>
                        <span class="detail-info-value" th:text="${order.shippingAddress}">-</span>
                    </div>
                    <div class="detail-info-item">
                        <span class="detail-info-label">Dibuat</span>
                        <span class="detail-info-value" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">-</span>
                    </div>
                    <div class="detail-info-item">
                        <span class="detail-info-label">Diperbarui</span>
                        <span class="detail-info-value" th:text="${#temporals.format(order.updatedAt, 'dd MMM yyyy HH:mm')}">-</span>
                    </div>
                </div>

                <!-- Rating Display (if already rated) -->
                <div class="rating-display" th:if="${order.ratingProduk != null or order.ratingJastiper != null}">
                    <h4>⭐ Rating</h4>
                    <!-- Rating Produk -->
                    <div class="rating-row" th:if="${order.ratingProduk != null}">
                        <span class="rating-label">Rating Produk</span>
                        <span class="stars">
                            <span th:each="i : ${#numbers.sequence(1,5)}"
                                  th:classappend="${i <= order.ratingProduk ? 'star-filled' : 'star-empty'}"
                                  class="star">&#9733;</span>
                        </span>
                    </div>
                    <!-- Rating Jastiper -->
                    <div class="rating-row" th:if="${order.ratingJastiper != null}">
                        <span class="rating-label">Rating Jastiper</span>
                        <span class="stars">
                            <span th:each="i : ${#numbers.sequence(1,5)}"
                                  th:classappend="${i <= order.ratingJastiper ? 'star-filled' : 'star-empty'}"
                                  class="star">&#9733;</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: Timeline + Actions + Rating -->
        <div>
            <div class="detail-card">
                <h3>🕐 Riwayat Status</h3>
                <div class="timeline">
                    <div class="timeline-item" th:each="history : ${statusHistory}">
                        <div class="timeline-dot"
                             th:classappend="${history.status.name() == 'COMPLETED' ? 'dot-completed' :
                                             (history.status.name() == 'CANCELLED' ? 'dot-cancelled' : '')}"></div>
                        <div class="timeline-content">
                            <span class="status-badge"
                                  th:classappend="${
                                      history.status.name() == 'PAID' ? 'status-paid' :
                                      (history.status.name() == 'PURCHASED' ? 'status-purchased' :
                                      (history.status.name() == 'SHIPPED' ? 'status-shipped' :
                                      (history.status.name() == 'COMPLETED' ? 'status-completed' : 'status-cancelled')))
                                  }"
                                  th:text="${history.status}">STATUS</span>
                            <div class="timeline-time"
                                 th:text="${#temporals.format(history.timestamp, 'dd MMM yyyy HH:mm:ss')}">-</div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="detail-actions">
                    <input type="hidden" id="currentUserId" th:value="${currentUserId}">
                    <input type="hidden" id="orderId" th:value="${order.id}">
                    <input type="hidden" id="jastiperId" th:value="${order.jastiperId}">
                    <input type="hidden" id="buyerId" th:value="${order.buyerId}">
                    <input type="hidden" id="orderStatus" th:value="${order.status}">
                    <input type="hidden" id="hasRatingProduk" th:value="${order.ratingProduk != null ? 'true' : 'false'}">
                    <input type="hidden" id="hasRatingJastiper" th:value="${order.ratingJastiper != null ? 'true' : 'false'}">
                    <input type="hidden" id="isAdmin" th:value="${isAdmin != null ? isAdmin : false}">

                    <button id="btnBuy" class="btn-buy" style="display:none">🛒 Konfirmasi Dibeli</button>
                    <button id="btnShip" class="btn-ship" style="display:none">✈️ Konfirmasi Dikirim</button>
                    <button id="btnComplete" class="btn-complete" style="display:none">✅ Konfirmasi Diterima</button>
                    <button id="btnCancel" class="btn-cancel" style="display:none">❌ Batalkan Order</button>
                </div>

                <!-- Rating Form: Produk + Jastiper -->
                <div class="rating-form" id="ratingSection" style="display:none">
                    <h4>⭐ Beri Rating</h4>
                    <form id="ratingForm">
                        <!-- Rating Produk -->
                        <div class="rating-group" id="ratingProdukGroup">
                            <label>Rating Produk</label>
                            <div class="star-input" id="starProduk">
                                <input type="radio" name="ratingProduk" value="5" id="p5"><label for="p5">&#9733;</label>
                                <input type="radio" name="ratingProduk" value="4" id="p4"><label for="p4">&#9733;</label>
                                <input type="radio" name="ratingProduk" value="3" id="p3"><label for="p3">&#9733;</label>
                                <input type="radio" name="ratingProduk" value="2" id="p2"><label for="p2">&#9733;</label>
                                <input type="radio" name="ratingProduk" value="1" id="p1"><label for="p1">&#9733;</label>
                            </div>
                        </div>

                        <!-- Rating Jastiper -->
                        <div class="rating-group" id="ratingJastiperGroup">
                            <label>Rating Jastiper</label>
                            <div class="star-input" id="starJastiper">
                                <input type="radio" name="ratingJastiper" value="5" id="j5"><label for="j5">&#9733;</label>
                                <input type="radio" name="ratingJastiper" value="4" id="j4"><label for="j4">&#9733;</label>
                                <input type="radio" name="ratingJastiper" value="3" id="j3"><label for="j3">&#9733;</label>
                                <input type="radio" name="ratingJastiper" value="2" id="j2"><label for="j2">&#9733;</label>
                                <input type="radio" name="ratingJastiper" value="1" id="j1"><label for="j1">&#9733;</label>
                            </div>
                        </div>

                        <button type="submit" class="rating-submit">Kirim Rating</button>
                    </form>
                    <div class="form-status" id="rating-status" aria-live="polite">&nbsp;</div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentUserId = document.getElementById('currentUserId').value;
    const orderId = document.getElementById('orderId').value;
    const jastiperId = document.getElementById('jastiperId').value;
    const buyerId = document.getElementById('buyerId').value;
    const status = document.getElementById('orderStatus').value;
    const hasRatingProduk = document.getElementById('hasRatingProduk').value === 'true';
    const hasRatingJastiper = document.getElementById('hasRatingJastiper').value === 'true';
    const isAdmin = document.getElementById('isAdmin').value === 'true';

    const isJastiper = currentUserId === jastiperId;
    const isBuyer = currentUserId === buyerId;

    // Show relevant action buttons
    if (isJastiper && status === 'PAID') document.getElementById('btnBuy').style.display = '';
    if (isJastiper && status === 'PURCHASED') document.getElementById('btnShip').style.display = '';
    if (isBuyer && status === 'SHIPPED') document.getElementById('btnComplete').style.display = '';
    if ((isJastiper || isBuyer || isAdmin) && (status === 'PAID' || status === 'PURCHASED')) {
        document.getElementById('btnCancel').style.display = '';
    }

    // Show rating form for buyer on COMPLETED orders that haven't been fully rated
    const needsProdukRating = !hasRatingProduk;
    const needsJastiperRating = !hasRatingJastiper;

    if (isBuyer && status === 'COMPLETED' && (needsProdukRating || needsJastiperRating)) {
        document.getElementById('ratingSection').style.display = '';

        // Hide rating groups that are already rated
        if (hasRatingProduk) {
            document.getElementById('ratingProdukGroup').style.display = 'none';
        }
        if (hasRatingJastiper) {
            document.getElementById('ratingJastiperGroup').style.display = 'none';
        }
    }

    // Button handlers
    document.getElementById('btnBuy').addEventListener('click', () => updateStatus('PURCHASED'));
    document.getElementById('btnShip').addEventListener('click', () => updateStatus('SHIPPED'));
    document.getElementById('btnComplete').addEventListener('click', () => updateStatus('COMPLETED'));
    document.getElementById('btnCancel').addEventListener('click', () => cancelOrder());

    // Rating form handler
    document.getElementById('ratingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const statusEl = document.getElementById('rating-status');

        const ratingProduk = document.querySelector('input[name="ratingProduk"]:checked');
        const ratingJastiper = document.querySelector('input[name="ratingJastiper"]:checked');

        // At least one rating must be selected (only from visible groups)
        const produkVisible = document.getElementById('ratingProdukGroup').style.display !== 'none';
        const jastiperVisible = document.getElementById('ratingJastiperGroup').style.display !== 'none';

        if ((produkVisible && !ratingProduk) && (jastiperVisible && !ratingJastiper)) {
            statusEl.textContent = 'Pilih minimal satu rating.';
            statusEl.className = 'form-status tone-error';
            return;
        }

        statusEl.textContent = 'Mengirim rating...';
        statusEl.className = 'form-status tone-warning';

        const body = {};
        if (ratingProduk) body.ratingProduk = parseInt(ratingProduk.value);
        if (ratingJastiper) body.ratingJastiper = parseInt(ratingJastiper.value);

        try {
            const response = await fetch('/api/orders/' + orderId + '/rating', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (response.ok) {
                statusEl.textContent = 'Rating berhasil dikirim!';
                statusEl.className = 'form-status tone-success';
                setTimeout(() => window.location.reload(), 1000);
            } else {
                const err = await response.text();
                statusEl.textContent = 'Gagal: ' + err;
                statusEl.className = 'form-status tone-error';
            }
        } catch (err) {
            statusEl.textContent = 'Terjadi kesalahan sistem.';
            statusEl.className = 'form-status tone-error';
        }
    });
});

async function updateStatus(newStatus) {
    if (!confirm('Ubah status ke ' + newStatus + '?')) return;
    try {
        const response = await fetch('/api/orders/' + document.getElementById('orderId').value + '/status?status=' + newStatus, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' }
        });
        if (response.ok) {
            alert('Status berhasil diupdate!');
            window.location.reload();
        } else {
            alert('Gagal: ' + await response.text());
        }
    } catch (e) {
        alert('System error.');
    }
}

async function cancelOrder() {
    if (!confirm('Batalkan order ini? Saldo akan dikembalikan.')) return;
    try {
        const response = await fetch('/api/orders/' + document.getElementById('orderId').value + '/cancel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        if (response.ok) {
            alert('Order dibatalkan!');
            window.location.href = '/order/list';
        } else {
            alert('Gagal cancel: ' + await response.text());
        }
    } catch (e) {
        alert('System error.');
    }
}
</script>
</body>
</html>
