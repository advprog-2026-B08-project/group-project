<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; border: none; }
        .badge-status { font-size: 1rem; padding: 0.5rem 1rem; }
        .timeline { position: relative; padding-left: 2rem; }
        .timeline::before { content: ''; position: absolute; left: 0.6rem; top: 0; bottom: 0; width: 2px; background: #dee2e6; }
        .timeline-item { position: relative; margin-bottom: 1.2rem; }
        .timeline-dot { position: absolute; left: -1.9rem; width: 1rem; height: 1rem; border-radius: 50%; background: #0d6efd; top: 0.25rem; }
        .timeline-dot.completed { background: #198754; }
        .timeline-dot.cancelled { background: #dc3545; }
    </style>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-5 mb-5">

    <div class="d-flex align-items-center mb-4 gap-3">
        <a href="/order/list" class="btn btn-outline-secondary">← Back</a>
        <h2 class="mb-0 fw-bold">📋 Order Detail</h2>
    </div>

    <div class="row g-4">
        <div class="col-md-7">
            <div class="card shadow-sm h-100">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4">Informasi Order</h5>

                    <div class="mb-3 d-flex justify-content-between align-items-center">
                        <span class="text-muted">Status</span>
                        <span class="badge badge-status"
                              th:classappend="${order.status.name() == 'COMPLETED' ? 'bg-success' :
                                              (order.status.name() == 'CANCELLED' ? 'bg-danger' :
                                              (order.status.name() == 'SHIPPED' ? 'bg-info' :
                                              (order.status.name() == 'PURCHASED' ? 'bg-primary' : 'bg-warning text-dark')))}"
                              th:text="${order.status}">PAID</span>
                    </div>

                    <hr>

                    <div class="row g-3">
                        <div class="col-12">
                            <small class="text-muted d-block">Order ID</small>
                            <span class="font-monospace" th:text="${order.id}">-</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Buyer ID</small>
                            <span class="font-monospace" th:text="${order.buyerId}">-</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Jastiper ID</small>
                            <span class="font-monospace" th:text="${order.jastiperId}">-</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Product ID</small>
                            <span class="font-monospace" th:text="${order.productId}">-</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Jumlah</small>
                            <span th:text="${order.quantity} + ' pcs'">-</span>
                        </div>
                        <div class="col-12">
                            <small class="text-muted d-block">Total Harga</small>
                            <span class="fw-bold fs-5 text-success"
                                  th:text="${'Rp ' + #numbers.formatDecimal(order.totalPrice, 0, 'POINT', 0, 'COMMA')}">-</span>
                        </div>
                        <div class="col-12">
                            <small class="text-muted d-block">Alamat Pengiriman</small>
                            <span th:text="${order.shippingAddress}">-</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Dibuat</small>
                            <span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">-</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Diperbarui</small>
                            <span th:text="${#temporals.format(order.updatedAt, 'dd MMM yyyy HH:mm')}">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4">Riwayat Status</h5>
                    <div class="timeline">
                        <div class="timeline-item" th:each="history : ${statusHistory}">
                            <div class="timeline-dot"
                                 th:classappend="${history.status.name() == 'COMPLETED' ? ' completed' :
                                                 (history.status.name() == 'CANCELLED' ? ' cancelled' : '')}"></div>
                            <div class="ps-1">
                                <span class="badge"
                                      th:classappend="${history.status.name() == 'COMPLETED' ? 'bg-success' :
                                                      (history.status.name() == 'CANCELLED' ? 'bg-danger' :
                                                      (history.status.name() == 'SHIPPED' ? 'bg-info' :
                                                      (history.status.name() == 'PURCHASED' ? 'bg-primary' : 'bg-warning text-dark')))}"
                                      th:text="${history.status}">STATUS</span>
                                <small class="text-muted d-block mt-1"
                                       th:text="${#temporals.format(history.timestamp, 'dd MMM yyyy HH:mm:ss')}">-</small>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 d-grid gap-2">
                        <input type="hidden" id="currentUserId" th:value="${currentUserId}">
                        <input type="hidden" id="orderId" th:value="${order.id}">
                        <input type="hidden" id="jastiperId" th:value="${order.jastiperId}">
                        <input type="hidden" id="buyerId" th:value="${order.buyerId}">
                        <input type="hidden" id="orderStatus" th:value="${order.status}">

                        <button id="btnBuy" class="btn btn-primary" style="display:none">🛒 Konfirmasi Dibeli</button>
                        <button id="btnShip" class="btn btn-info text-white" style="display:none">✈️ Konfirmasi Dikirim</button>
                        <button id="btnComplete" class="btn btn-success" style="display:none">✅ Konfirmasi Diterima</button>
                        <button id="btnCancel" class="btn btn-outline-danger" style="display:none">❌ Batalkan Order</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentUserId = document.getElementById('currentUserId').value;
        const orderId = document.getElementById('orderId').value;
        const jastiperId = document.getElementById('jastiperId').value;
        const buyerId = document.getElementById('buyerId').value;
        const status = document.getElementById('orderStatus').value;

        const isJastiper = currentUserId === jastiperId;
        const isBuyer = currentUserId === buyerId;

        if (isJastiper && status === 'PAID') document.getElementById('btnBuy').style.display = '';
        if (isJastiper && status === 'PURCHASED') document.getElementById('btnShip').style.display = '';
        if (isBuyer && status === 'SHIPPED') document.getElementById('btnComplete').style.display = '';
        if ((isJastiper || isBuyer) && (status === 'PAID' || status === 'PURCHASED')) {
            document.getElementById('btnCancel').style.display = '';
        }

        document.getElementById('btnBuy').addEventListener('click', () => updateStatus('PURCHASED'));
        document.getElementById('btnShip').addEventListener('click', () => updateStatus('SHIPPED'));
        document.getElementById('btnComplete').addEventListener('click', () => updateStatus('COMPLETED'));
        document.getElementById('btnCancel').addEventListener('click', () => cancelOrder());
    });

    async function updateStatus(newStatus) {
        if (!confirm('Ubah status ke ' + newStatus + '?')) return;
        try {
            const response = await fetch('/api/orders/' + document.getElementById('orderId').value + '/status?status=' + newStatus, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' }
            });
            if (response.ok) {
                alert('Status berhasil diupdate!');
                window.location.reload();
            } else {
                alert('Gagal: ' + await response.text());
            }
        } catch (e) {
            alert('System error.');
        }
    }

    async function cancelOrder() {
        if (!confirm('Batalkan order ini? Saldo akan dikembalikan.')) return;
        try {
            const response = await fetch('/api/orders/' + document.getElementById('orderId').value + '/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            if (response.ok) {
                alert('Order dibatalkan!');
                window.location.href = '/order/list';
            } else {
                alert('Gagal cancel: ' + await response.text());
            }
        } catch (e) {
            alert('System error.');
        }
    }
</script>
</body>
</html>
