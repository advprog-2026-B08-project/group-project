<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="orderCard(order, iter)"
     class="me-card order-card"
     th:data-order-id="${order.id}"
     th:data-jastiper-id="${order.jastiperId}"
     th:data-buyer-id="${order.buyerId}"
     th:data-status="${order.status}"
     style="display: grid; grid-template-columns: auto 1fr auto auto auto auto; gap: 20px; align-items: center; padding: 16px 20px; margin-bottom: 16px; cursor: pointer; transition: transform 0.15s ease;">

    <!-- Product Image -->
    <div style="width: 60px; height: 60px; border: var(--me-border-w) solid var(--me-border); border-radius: var(--me-radius); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--me-bg);">
        <img th:if="${order.productImageUrl != null and !order.productImageUrl.isEmpty()}"
             th:src="${order.productImageUrl}"
             alt="Product" style="width: 100%; height: 100%; object-fit: cover;">
        <span th:if="${order.productImageUrl == null or order.productImageUrl.isEmpty()}" style="font-size: 1.5rem;">📦</span>
    </div>

    <!-- Product & Order Info -->
    <div class="me-stack" style="gap: 4px; overflow: hidden;">
        <h4 style="margin: 0; font-size: 1.1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
            th:text="${order.productName != null ? order.productName : 'Produk'}">Produk</h4>
        <div style="font-size: 0.85rem; color: var(--me-text-secondary); display: flex; gap: 8px; align-items: center;">
            <span th:text="${order.quantity + ' pcs'}">1 pcs</span>
            <span>•</span>
            <span th:text="${'Jastiper: ' + (order.jastiperUsername != null ? order.jastiperUsername : '-')}">Jastiper: -</span>
        </div>
    </div>

    <!-- Price -->
    <div style="font-weight: 800; font-size: 1.1rem; white-space: nowrap;"
         th:text="${'Rp ' + #numbers.formatDecimal(order.totalPrice, 0, 'POINT', 0, 'COMMA')}">Rp 50.000</div>

    <!-- Status Badge -->
    <div>
        <span class="me-badge"
              th:classappend="${
                  order.status.name() == 'PAID' ? 'me-badge--warning' :
                  (order.status.name() == 'PURCHASED' ? 'me-badge--info' :
                  (order.status.name() == 'SHIPPED' ? 'me-badge--info' :
                  (order.status.name() == 'COMPLETED' ? 'me-badge--success' : 'me-badge--danger')))
              }"
              th:text="${order.status}">PAID</span>
    </div>

    <!-- Date -->
    <div style="font-size: 0.85rem; color: var(--me-text-secondary); white-space: nowrap;"
         th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">01 Jan 2026</div>

    <!-- Actions -->
    <div class="order-actions" onclick="event.stopPropagation()" style="display: flex; gap: 8px; justify-content: flex-end;">
        <!-- Jastiper: Buy -->
        <button th:if="${order.status.name() == 'PAID'}"
                class="me-btn me-btn--primary me-btn--sm jastiper-only"
                th:data-id="${order.id}"
                th:data-jastiper-id="${order.jastiperId}"
                data-action="PURCHASED"
                style="padding: 6px 12px; font-size: 0.8rem;">🛒 Beli</button>

        <!-- Jastiper: Ship -->
        <button th:if="${order.status.name() == 'PURCHASED'}"
                class="me-btn me-btn--primary me-btn--sm jastiper-only"
                th:data-id="${order.id}"
                th:data-jastiper-id="${order.jastiperId}"
                data-action="SHIPPED"
                style="padding: 6px 12px; font-size: 0.8rem;">✈️ Kirim</button>

        <!-- Buyer: Complete -->
        <button th:if="${order.status.name() == 'SHIPPED'}"
                class="me-btn me-btn--success me-btn--sm buyer-only"
                th:data-id="${order.id}"
                th:data-buyer-id="${order.buyerId}"
                data-action="COMPLETED"
                style="padding: 6px 12px; font-size: 0.8rem;">✅ Terima</button>

        <!-- Cancel (Buyer, Jastiper, or Admin) -->
        <button th:if="${order.status.name() == 'PAID' or order.status.name() == 'PURCHASED'}"
                class="me-btn me-btn--danger me-btn--sm cancel cancel-btn"
                th:data-id="${order.id}"
                th:data-buyer-id="${order.buyerId}"
                th:data-jastiper-id="${order.jastiperId}"
                style="padding: 6px 12px; font-size: 0.8rem;">❌ Batal</button>

        <!-- Completed: show ratings -->
        <span th:if="${order.status.name() == 'COMPLETED'}" style="font-size: 11px; line-height: 1.5; color: var(--me-text-muted);">
            <span th:if="${order.ratingProduk != null}" style="display: block;">
                📦
                <span th:each="i : ${#numbers.sequence(1,5)}"
                      th:style="${i <= order.ratingProduk ? 'color: #f5b301;' : 'color: #d0d0d0;'}"
                      style="font-size: 13px;">&#9733;</span>
            </span>
            <span th:if="${order.ratingJastiper != null}" style="display: block;">
                👤
                <span th:each="i : ${#numbers.sequence(1,5)}"
                      th:style="${i <= order.ratingJastiper ? 'color: #f5b301;' : 'color: #d0d0d0;'}"
                      style="font-size: 13px;">&#9733;</span>
            </span>
            <span th:if="${order.ratingProduk == null and order.ratingJastiper == null}">—</span>
        </span>

        <!-- Cancelled: no actions -->
        <span th:if="${order.status.name() == 'CANCELLED'}"
              style="color: var(--me-text-muted); font-size: 0.9rem;">—</span>
    </div>
</div>

</html>
