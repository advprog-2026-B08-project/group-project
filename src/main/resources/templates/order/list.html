<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body class="order-body">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="order-shell">
    <input type="hidden" id="currentUserId" th:value="${currentUserId}" />
    <input type="hidden" id="isAdmin" th:value="${isAdmin}" />

    <!-- Hero Header -->
    <div class="order-list-hero">
        <div>
            <span class="eyebrow">Order Management</span>
            <h1>Daftar Pesanan</h1>
            <p class="hero-subtitle">Kelola dan lacak semua pesanan di sini.</p>
        </div>
        <div class="hero-actions">
            <a href="/catalog" class="btn-ghost">← Kembali ke Katalog</a>
        </div>
    </div>

    <!-- Order Cards -->
    <div class="order-cards" id="orderCards">
        <div th:each="order, iter : ${orders}"
             class="order-card order-card-rich"
             th:data-order-id="${order.id}"
             th:data-jastiper-id="${order.jastiperId}"
             th:data-buyer-id="${order.buyerId}"
             th:data-status="${order.status}"
             th:style="'animation-delay: ' + ${iter.index * 0.04} + 's'">

            <!-- Product Image -->
            <div class="order-card-image">
                <img th:if="${order.productImageUrl != null and !order.productImageUrl.isEmpty()}"
                     th:src="${order.productImageUrl}"
                     alt="Product" class="order-product-img">
                <div th:if="${order.productImageUrl == null or order.productImageUrl.isEmpty()}"
                     class="order-product-img-placeholder">📦</div>
            </div>

            <!-- Product & Order Info -->
            <div class="order-card-info">
                <div class="order-card-product-name"
                     th:text="${order.productName != null ? order.productName : 'Produk'}">Produk</div>
                <div class="order-card-meta">
                    <span th:text="${order.quantity + ' pcs'}">1 pcs</span>
                    <span>•</span>
                    <span th:text="${'Jastiper: ' + (order.jastiperUsername != null ? order.jastiperUsername : '-')}">Jastiper: -</span>
                </div>
            </div>

            <!-- Price -->
            <div class="order-card-price"
                 th:text="${'Rp ' + #numbers.formatDecimal(order.totalPrice, 0, 'POINT', 0, 'COMMA')}">Rp 50.000</div>

            <!-- Status Badge -->
            <div>
                <span class="status-badge"
                      th:classappend="${
                          order.status.name() == 'PAID' ? 'status-paid' :
                          (order.status.name() == 'PURCHASED' ? 'status-purchased' :
                          (order.status.name() == 'SHIPPED' ? 'status-shipped' :
                          (order.status.name() == 'COMPLETED' ? 'status-completed' : 'status-cancelled')))
                      }"
                      th:text="${order.status}">PAID</span>
            </div>

            <!-- Date -->
            <div class="order-card-date"
                 th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">01 Jan 2026</div>

            <!-- Actions -->
            <div class="order-actions" onclick="event.stopPropagation()">
                <!-- Jastiper: Buy -->
                <button th:if="${order.status.name() == 'PAID'}"
                        class="action-btn-sm buy jastiper-only"
                        th:data-id="${order.id}"
                        th:data-jastiper-id="${order.jastiperId}"
                        data-action="PURCHASED">🛒 Beli</button>

                <!-- Jastiper: Ship -->
                <button th:if="${order.status.name() == 'PURCHASED'}"
                        class="action-btn-sm ship jastiper-only"
                        th:data-id="${order.id}"
                        th:data-jastiper-id="${order.jastiperId}"
                        data-action="SHIPPED">✈️ Kirim</button>

                <!-- Buyer: Complete -->
                <button th:if="${order.status.name() == 'SHIPPED'}"
                        class="action-btn-sm complete buyer-only"
                        th:data-id="${order.id}"
                        th:data-buyer-id="${order.buyerId}"
                        data-action="COMPLETED">✅ Terima</button>

                <!-- Cancel (Buyer, Jastiper, or Admin) -->
                <button th:if="${order.status.name() == 'PAID' or order.status.name() == 'PURCHASED'}"
                        class="action-btn-sm cancel cancel-btn"
                        th:data-id="${order.id}"
                        th:data-buyer-id="${order.buyerId}"
                        th:data-jastiper-id="${order.jastiperId}">❌ Batal</button>

                <!-- Completed/Cancelled: no actions -->
                <span th:if="${order.status.name() == 'COMPLETED' or order.status.name() == 'CANCELLED'}"
                      class="order-card-date">—</span>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(orders)}" class="order-empty">
            <span class="order-empty-icon">📦</span>
            <p>Belum ada pesanan.</p>
            <a href="/catalog" class="btn-ghost" style="margin-top: 12px; display: inline-block;">Belanja Sekarang</a>
        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentUserId = document.getElementById('currentUserId').value;
    const isAdmin = document.getElementById('isAdmin').value === 'true';

    // Click row to go to detail
    document.querySelectorAll('.order-card[data-order-id]').forEach(function(card) {
        card.addEventListener('click', function(e) {
            if (e.target.closest('button')) return;
            window.location.href = '/order/' + card.dataset.orderId;
        });
    });

    // Hide jastiper-only buttons for non-jastipers
    document.querySelectorAll('.jastiper-only').forEach(function(btn) {
        if (btn.dataset.jastiperId !== currentUserId) {
            btn.style.display = 'none';
        }
    });

    // Hide buyer-only buttons for non-buyers
    document.querySelectorAll('.buyer-only').forEach(function(btn) {
        if (btn.dataset.buyerId !== currentUserId) {
            btn.style.display = 'none';
        }
    });

    // Hide cancel for users who are neither buyer nor jastiper (admin always sees cancel)
    document.querySelectorAll('.cancel-btn').forEach(function(btn) {
        if (!isAdmin && btn.dataset.buyerId !== currentUserId && btn.dataset.jastiperId !== currentUserId) {
            btn.style.display = 'none';
        }
    });

    // Status update handler
    document.querySelectorAll('.action-btn-sm[data-action]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            updateStatus(this.dataset.id, this.dataset.action);
        });
    });

    // Cancel handler
    document.querySelectorAll('.cancel-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            cancelOrder(this.dataset.id);
        });
    });
});

async function updateStatus(orderId, newStatus) {
    if (!confirm('Ubah status order ke ' + newStatus + '?')) return;
    try {
        const response = await fetch('/api/orders/' + orderId + '/status?status=' + newStatus, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' }
        });
        if (response.ok) {
            alert('Status berhasil diupdate!');
            window.location.reload();
        } else {
            alert('Gagal: ' + await response.text());
        }
    } catch (e) {
        alert('System error.');
    }
}

async function cancelOrder(orderId) {
    if (!confirm('Batalkan order ini? Saldo akan dikembalikan.')) return;
    try {
        const response = await fetch('/api/orders/' + orderId + '/cancel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        if (response.ok) {
            alert('Order dibatalkan dan saldo dikembalikan!');
            window.location.reload();
        } else {
            alert('Gagal cancel: ' + await response.text());
        }
    } catch (e) {
        alert('System error.');
    }
}
</script>
</body>
</html>
