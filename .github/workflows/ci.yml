name: SonarCloud
on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]
    
jobs:
  build:
    name: Build, Lint, and Analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Sonar & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.sonar/cache
            ~/.gradle/caches
          key: ${{ runner.os }}-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Linter (Checkstyle)
        run: ./gradlew checkstyleMain

      - name: Build and Analyze
        env:
          SPRING_PROFILES_ACTIVE: test
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build jacocoTestReport sonar --info

      - name: Prepare Reports for Deployment
        run: |
          mkdir -p public-reports
          cp -r build/reports/tests/test public-reports/tests
          cp -r build/reports/checkstyle public-reports/linter
          cp -r build/reports/jacoco/test/html public-reports/coverage

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-reports
          publish_branch: gh-pages

  deploy-staging:
    needs: build
    environment: staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to Heroku Staging
        run: echo "Deploying to Heroku Staging..."

  deploy-production:
    needs: build
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to Heroku Production
        run: echo "Deploying to Heroku Production..."